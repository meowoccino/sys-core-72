<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashley AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Temporary Key Extraction Box */
    #recovery-box {
      background: #022c22;
      border: 2px solid #10b981;
      padding: 10px;
      margin: 8px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 1000;
      flex-shrink: 0;
    }
    #recovery-box textarea {
      width: 100%;
      height: 65px;
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      margin-top: 6px;
      resize: none;
    }
    #recovery-box button {
      background: #10b981;
      color: #022c22;
      border: none;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Main UI Header */
    header {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 2px;
    }
    .msg.char {
      align-self: flex-start;
      background: #334155;
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }
    .msg .meta {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    #typing-indicator {
      display: none;
      align-self: flex-start;
      background: #334155;
      color: #94a3b8;
      font-style: italic;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
    }

    footer {
      background: #1e293b;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #334155;
    }
    footer input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }
    footer button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    #stop-btn {
      background: #ef4444;
      display: none;
    }

    /* Settings Modal */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(2px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-box h2 { font-size: 16px; }
    .modal-box label { font-size: 12px; color: #94a3b8; }
    .modal-box textarea {
      width: 100%;
      height: 90px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      resize: none;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-buttons button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save { background: #2563eb; color: #fff; }
    .btn-cancel { background: #475569; color: #fff; }
  </style>
</head>
<body>

  <!-- Key Storage Dumper -->
  <div id="recovery-box">
    <strong>Storage Dump (Find Saved Key Below):</strong>
    <textarea id="dump-area" readonly></textarea>
    <div style="display: flex; gap: 8px;">
      <button onclick="copyExtractedKey()">Copy Detected Key</button>
      <button onclick="document.getElementById('recovery-box').style.display='none'" style="background:#475569; color:#fff;">Dismiss</button>
    </div>
  </div>

  <header>
    <h1>Ashley AI</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="openSettings()">Settings</button>
    </div>
  </header>

  <div id="chat-container"></div>
  <div id="typing-indicator">Ashley is writing...</div>

  <footer>
    <input type="text" id="user-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') handleSend()">
    <button id="send-btn" onclick="handleSend()">Send</button>
    <button id="stop-btn" onclick="handleStop()">Stop</button>
  </footer>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div class="modal-box">
      <h2>API Settings</h2>
      <label>OpenRouter API Keys (comma-separated for auto-rotation):</label>
      <textarea id="keys-input" placeholder="sk-or-v1-key1..., sk-or-v1-key2..."></textarea>
      <div id="active-key-info" style="font-size:11px; color:#38bdf8;"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeSettings()">Close</button>
        <button class="btn-save" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    var MODEL_NAME = "nousresearch/hermes-3-llama-3.1-405b:free";
    var MAX_TOKENS = 500;
    var TEMPERATURE = 0.85;

    var chatHistory = JSON.parse(localStorage.getItem('chat_history') || "[]");
    var isGenerating = false;
    var abortController = null;
    var generationStartTime = 0;

    // 1. Initial Storage Dumper & Auto-Recovery
    var detectedKey = "";
    (function runStorageDump() {
      var dumpText = "";
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        var v = localStorage.getItem(k);
        dumpText += k + " = " + v + "\n\n";

        if (v && v.indexOf("sk-or-v1-") !== -1 && !detectedKey) {
          var match = v.match(/sk-or-v1-[a-zA-Z0-9_-]+/);
          if (match) detectedKey = match[0];
        }
      }
      var area = document.getElementById('dump-area');
      if (area) area.value = dumpText || "Storage is completely empty.";

      if (detectedKey && !localStorage.getItem('openrouter_keys')) {
        localStorage.setItem('openrouter_keys', detectedKey);
      }
    })();

    function copyExtractedKey() {
      if (!detectedKey) {
        alert("No sk-or-v1 key found in storage dump.");
        return;
      }
      navigator.clipboard.writeText(detectedKey).then(function() {
        alert("Copied detected key to clipboard!");
      }).catch(function() {
        alert("Detected key: " + detectedKey);
      });
    }

    // 2. Key Management & Rotation
    function getKeys() {
      var raw = localStorage.getItem('openrouter_keys') || localStorage.getItem('openrouter_key') || "";
      return raw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
    }

    function getActiveIndex() {
      return parseInt(localStorage.getItem('openrouter_active_idx') || "0", 10);
    }

    function rotateToNextKey() {
      var keys = getKeys();
      if (keys.length <= 1) return;
      var nextIdx = (getActiveIndex() + 1) % keys.length;
      localStorage.setItem('openrouter_active_idx', nextIdx.toString());
    }

    // 3. UI Helpers
    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function setStopButtonState(generating) {
      document.getElementById('send-btn').style.display = generating ? 'none' : 'block';
      document.getElementById('stop-btn').style.display = generating ? 'block' : 'none';
    }

    function showTypingIndicator() {
      document.getElementById('typing-indicator').style.display = 'block';
      document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
    }

    function removeTypingIndicator() {
      document.getElementById('typing-indicator').style.display = 'none';
    }

    function saveChatHistory() {
      localStorage.setItem('chat_history', JSON.stringify(chatHistory));
    }

    function renderFullChat() {
      var c = document.getElementById('chat-container');
      c.innerHTML = "";
      chatHistory.forEach(function(msg) {
        var el = document.createElement('div');
        el.className = "msg " + msg.role;
        el.innerHTML = "<div>" + msg.text + "</div><div class='meta'>" + (msg.time || "") + (msg.duration ? (" • " + msg.duration) : "") + "</div>";
        c.appendChild(el);
      });
      c.scrollTop = c.scrollHeight;
    }

    // 4. Payload & Background Processing
    function buildOpenRouterPayload() {
      var messages = [
        { role: "system", content: "You are Ashley, a lively, expressive, and playful companion. Respond naturally, maintaining your persona." }
      ];

      var summary = localStorage.getItem('chat_summary');
      if (summary) {
        messages.push({ role: "system", content: "Context summary: " + summary });
      }

      chatHistory.slice(-8).forEach(function(m) {
        messages.push({
          role: m.role === 'user' ? 'user' : 'assistant',
          content: m.text
        });
      });

      return messages;
    }

    async function triggerBackgroundSummary() {
      if (chatHistory.length < 10) return;
      var keys = getKeys();
      if (keys.length === 0) return;

      var activeKey = keys[getActiveIndex()] || keys[0];
      try {
        var payload = [
          { role: "system", content: "Summarize the key relationship details, current scenario context, and important user facts in 2-3 concise sentences." },
          { role: "user", content: JSON.stringify(chatHistory.slice(-12)) }
        ];

        var res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + activeKey },
          body: JSON.stringify({ model: MODEL_NAME, messages: payload, max_tokens: 150 })
        });
        if (res.ok) {
          var data = await res.json();
          if (data.choices && data.choices[0] && data.choices[0].message) {
            localStorage.setItem('chat_summary', data.choices[0].message.content.trim());
          }
        }
      } catch (e) {
        // Silent catch for background process
      }
    }

    // 5. Main Generation Loop with Silent Key Switching
    async function triggerAIResponse() {
      var keys = getKeys();
      if (keys.length === 0) {
        alert("No API key configured. Tap Settings to add one.");
        return;
      }

      isGenerating = true;
      setStopButtonState(true);
      showTypingIndicator();

      generationStartTime = Date.now();
      abortController = new AbortController();

      var attempts = 0;
      var maxAttempts = Math.max(1, keys.length);
      var success = false;

      while (attempts < maxAttempts && !success) {
        var currentIdx = getActiveIndex();
        if (currentIdx >= keys.length) { currentIdx = 0; localStorage.setItem('openrouter_active_idx', "0"); }
        var activeKey = keys[currentIdx];

        try {
          var response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + activeKey
            },
            signal: abortController.signal,
            body: JSON.stringify({
              model: MODEL_NAME,
              messages: buildOpenRouterPayload(),
              temperature: TEMPERATURE,
              max_tokens: MAX_TOKENS
            })
          });

          if (!response.ok) {
            var errorData = await response.json().catch(function() { return {}; });
            var msg = (errorData && errorData.error && errorData.error.message) ? errorData.error.message : ("HTTP " + response.status);

            // Silent switch on rate limit (429) or invalid key (401)
            if (response.status === 429 || response.status === 401 || msg.includes("rate") || msg.includes("quota")) {
              rotateToNextKey();
              attempts++;
              continue;
            }
            throw new Error(msg);
          }

          var data = await response.json();
          var generatedText = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content.trim() : "";

          if (generatedText && !generatedText.startsWith('*')) {
            generatedText = '*' + generatedText;
          }

          var durationSec = Math.round((Date.now() - generationStartTime) / 1000) + "s (Key #" + (currentIdx + 1) + ")";
          chatHistory.push({ role: 'char', text: generatedText, time: formatTime(), duration: durationSec });
          saveChatHistory();
          renderFullChat();

          triggerBackgroundSummary();
          success = true;

        } catch (err) {
          if (err.name === 'AbortError') break;
          if (attempts >= maxAttempts - 1) {
            alert("All keys exhausted or request failed: " + err.message);
          }
          attempts++;
          rotateToNextKey();
        }
      }

      removeTypingIndicator();
      isGenerating = false;
      setStopButtonState(false);
      abortController = null;
    }

    function handleSend() {
      if (isGenerating) return;
      var input = document.getElementById('user-input');
      var txt = input.value.trim();
      if (!txt) return;

      chatHistory.push({ role: 'user', text: txt, time: formatTime() });
      saveChatHistory();
      renderFullChat();

      input.value = "";
      triggerAIResponse();
    }

    function handleStop() {
      if (abortController) {
        abortController.abort();
      }
    }

    // 6. Settings Modal Handlers
    function openSettings() {
      var keys = getKeys();
      document.getElementById('keys-input').value = keys.join(', ');
      var idx = getActiveIndex();
      document.getElementById('active-key-info').innerText = keys.length > 0 ? ("Currently using Key #" + (idx + 1) + " of " + keys.length) : "No keys stored.";
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettings() {
      var val = document.getElementById('keys-input').value.trim();
      localStorage.setItem('openrouter_keys', val);
      localStorage.setItem('openrouter_active_idx', "0");
      closeSettings();
      alert("Settings saved successfully!");
    }

    // Render chat history on boot
    renderFullChat();
  </script>
</body>
</html>
