<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ashley</title>

  <meta name="theme-color" content="#060a0c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060a0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" id="meta-theme-color" content="#060a0c">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ashley">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json?v=12">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #060a0c;
      --char-bubble: rgba(14, 24, 28, 0.88);
      --char-border: rgba(45, 140, 125, 0.28);
      --user-bubble: rgba(30, 24, 20, 0.88);
      --user-border: rgba(224, 160, 96, 0.35);
      --gold-accent: #d4af7a;
      --action-color: #e2c4a2;
      --speech-text: #f5f2ed;
      --text-dim: #889a9f;
      --danger-color: #e06c75;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: #060a0c;
      height: 100%;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #060a0c;
      color: var(--speech-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #app-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 85% 15%, rgba(14, 95, 82, 0.72) 0%, transparent 60%),
        radial-gradient(circle at 15% 85%, rgba(12, 65, 80, 0.6) 0%, transparent 65%),
        linear-gradient(180deg, #071517 0%, #060a0c 50%, #040708 100%);
      pointer-events: none;
    }

    #chat-stream {
      flex: 1;
      position: relative;
      z-index: 5;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .msg-group {
      display: flex;
      width: 100%;
      animation: softExpand 0.32s cubic-bezier(0.2, 1, 0.4, 1) forwards;
    }

    @keyframes softExpand {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .msg-group.ashley {
      justify-content: flex-start;
      padding-right: 4px;
    }

    .msg-group.ashley .ashley-wrapper {
      max-width: 96%;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 8px;
    }

    .msg-group.user {
      justify-content: flex-end;
      padding-left: 14%;
    }

    .msg-group.user .user-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .ashley-msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold-accent);
      flex-shrink: 0;
      margin-top: 4px;
      cursor: pointer;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .glass-bubble {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.45);
      font-size: 0.95rem;
      word-break: break-word;
    }

    .ashley .glass-bubble {
      background: var(--char-bubble);
      border: 1px solid var(--char-border);
      border-top-right-radius: 4px;
      border-top-left-radius: 18px;
    }

    .user .glass-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-top-right-radius: 4px;
    }

    .action {
      display: block;
      color: var(--action-color);
      font-style: italic;
      font-weight: 300;
      line-height: 1.65;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .speech {
      display: block;
      color: var(--speech-text);
      font-style: normal;
      font-weight: 400;
      line-height: 1.65;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .action:last-child,
    .speech:last-child {
      margin-bottom: 0;
    }

    .meta-time-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      margin-top: 6px;
      padding: 0 6px;
      color: var(--text-dim);
    }

    .user .meta-time-row {
      align-self: flex-start;
      margin-left: 2px;
    }

    .ashley .meta-time-row {
      align-self: flex-end;
      margin-right: 6px;
    }

    .meta-time-row svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .msg-action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 5px;
      border-radius: 4px;
    }

    .msg-action-btn:active {
      color: var(--gold-accent);
    }

    .msg-action-btn.delete-btn:active {
      color: var(--danger-color);
    }

    .msg-action-btn svg {
      width: 13px;
      height: 13px;
    }

    .msg-counter {
      font-size: 0.68rem;
      color: var(--text-dim);
      opacity: 0.75;
      font-weight: 500;
    }

    .thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      animation: fadeIn 0.3s ease;
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      background: var(--gold-accent);
      border-radius: 50%;
      opacity: 0.35;
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    .thinking-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    .thinking-status-text {
      font-size: 0.76rem;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      font-style: italic;
    }

    @keyframes pulseDot {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.85);
      }
      40% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: flex-end;
    }

    .sheet-content {
      width: 100%;
      max-height: 75vh;
      background: #0f1719;
      border-top: 1px solid var(--char-border);
      border-radius: 24px 24px 0 0;
      padding: 22px 18px calc(34px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-title {
      font-size: 0.78rem;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .edit-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px;
      color: var(--speech-text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 120px;
      outline: none;
      line-height: 1.5;
    }

    .sheet-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .sheet-save-btn {
      flex: 1;
      background: var(--gold-accent);
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #12100d;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .sheet-cancel-btn {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 8px 12px calc(14px + env(safe-area-inset-bottom, 0px));
      background: transparent;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .dock-input {
      flex: 1;
      background: rgba(10, 18, 20, 0.95);
      border: 1px solid rgba(45, 140, 125, 0.2);
      border-radius: 22px;
      padding: 8px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 42px;
    }

    .dock-input textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      height: 24px;
      max-height: 120px;
      line-height: 1.4;
      padding: 2px 0;
      overflow-y: auto;
      display: block;
      caret-color: var(--gold-accent);
    }

    .action-symbol-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.95rem;
      padding: 4px 6px;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .action-symbol-btn:active {
      color: var(--action-color);
    }

    .send-pill {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dfb479, #b88b48);
      border: none;
      color: #12100d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, border-radius 0.2s ease;
    }

    .send-pill.is-stopping {
      background: #3a2224;
      border: 1.5px solid var(--danger-color);
      color: var(--danger-color);
      border-radius: 14px;
    }

    #avatar-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 10, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-frame {
      max-width: 90vw;
      max-height: 78vh;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, var(--gold-accent), transparent 75%);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }

    .lightbox-frame img {
      width: 100%;
      height: 100%;
      max-height: 76vh;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .memory-fab {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 500;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(12, 14, 20, 0.85);
      border: 1px solid var(--char-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .memory-fab svg {
      width: 18px;
      height: 18px;
    }

    .memory-block {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
    }

    .memory-block-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .memory-block-body {
      font-size: 0.88rem;
      color: var(--speech-text);
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
    }

    .memory-block-empty {
      color: var(--text-dim);
      font-style: italic;
    }

    .memory-clear-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="ambient-bg"></div>

  <div id="app-container">

    <button type="button" class="memory-fab" onclick="openMemoryModal()" title="View stored data">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13.5"/>
        <path d="M6.5 21H18a2 2 0 0 0 2-2v-1H6.5a1.5 1.5 0 0 0 0 3Z"/>
        <circle cx="12.5" cy="9" r="1" fill="var(--gold-accent)" stroke="none"/>
      </svg>
    </button>

    <main id="chat-stream"></main>

    <footer id="input-footer">
      <div class="dock-input">
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Type a message or action..."
          spellcheck="true"
          autocorrect="on"
          autocomplete="on"
          autocapitalize="sentences"
          oninput="autoExpandTextarea(this)"
        ></textarea>

        <!-- INTENTIONAL: inserts ** and places cursor between them -->
        <button
          type="button"
          class="action-symbol-btn"
          onclick="insertActionWrapper()"
        >* *</button>
      </div>

      <button
        type="button"
        class="send-pill"
        id="actionBtn"
        onclick="handleActionClick()"
      >
        <svg id="actionIcon" class="icon" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>
  </div>

  <div id="edit-sheet" class="sheet-overlay" onclick="closeEditModal(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-title" id="edit-sheet-title">Edit Message</div>

      <textarea
        id="editMessageTextarea"
        class="edit-textarea"
        spellcheck="true"
        autocorrect="on"
      ></textarea>

      <div class="sheet-btn-row">
        <button
          type="button"
          class="sheet-cancel-btn"
          onclick="closeEditModal()"
        >Cancel</button>

        <button
          type="button"
          class="sheet-save-btn"
          onclick="saveEditedMessage()"
        >Save</button>
      </div>
    </div>
  </div>

  <div id="memory-sheet" class="sheet-overlay" onclick="closeMemoryModal(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-title">Stored Data</div>

      <div class="memory-block">
        <div class="memory-block-label">Memory Summary</div>
        <div class="memory-block-body" id="memorySummaryDisplay"></div>

        <button
          type="button"
          class="memory-clear-btn"
          onclick="clearMemorySummary()"
        >Clear Memory Summary</button>
      </div>

      <div class="memory-block">
        <div class="memory-block-label">Chat History</div>
        <div class="memory-block-body" id="chatHistoryCountDisplay"></div>

        <button
          type="button"
          class="memory-clear-btn"
          onclick="clearAllChatHistory()"
        >Clear All Messages</button>
      </div>

      <div class="sheet-btn-row">
        <button
          type="button"
          class="sheet-cancel-btn"
          onclick="closeMemoryModal()"
        >Close</button>
      </div>
    </div>
  </div>

  <div id="avatar-lightbox" onclick="closeLightbox()">
    <div class="lightbox-frame" onclick="event.stopPropagation()">
      <img
        src="./ashley.png"
        onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80'"
        alt=""
      >
    </div>
  </div>

  <script>
    var OPENROUTER_MODEL = "nousresearch/hermes-3-llama-3.1-405b";
    var OPENROUTER_SUMMARY_MODEL = "meta-llama/llama-3.3-70b-instruct:free";

    var HARDCODED_GREETING =
`*The heavy cabin door pushes open, letting in a brief gust of freezing mountain wind before I quickly pull it shut. I drop my roller suitcase and airline shoulder bag on the entryway mat, exhaling a long, frosty breath that instantly fogs up.*

*Shaking the snow from the hood of my winter coat, I push my blonde hair out of my face and look up at you, a tired but genuine grin breaking out across my lips.*

Tell me you have something hot to drink on the stove, because I'm pretty sure my fingers froze solid on that mountain pass. It is so good to see you, Mathew.`;

    var HARDCODED_PERSONA =
`Ashley is a 24-year-old commercial flight attendant visiting her childhood best friend since elementary school, Mathew ({{user}}), at his secluded mountain cabin during a break from flying. They have never worked together in an office or corporate setting; their entire history is built on growing up together and staying close long-distance.

She is warm, affectionate, grounded, and deeply human, sharing a comfortable, effortless history with Mathew. Having crossed the threshold from childhood crush to his fiancée after his proposal on day five of this cabin stay, she is blissfully happy, devoted, and radiating newlywed-style intimacy. Exhausted from grueling long-haul shifts and red-eye flights, she wants nothing more than to unwind, cuddle by the fire, celebrate their engagement, and be taken care of by him.

She thrives on lingering eye contact, teasing banter, and uninhibited physical closeness—whether admiring her engagement ring, sliding her cold feet under Mathew's thighs, or melting into his arms. She enthusiastically welcomes and matches Mathew's romantic, affectionate, and sexual energy without reservation.

She wears two pieces daily now: a Cartier LOVE pendant necklace, its interlocking gold circles half-paved in diamonds with the brand's signature screw-motif detailing, catching the light with every small movement — a gift from Mathew on the very first day she arrived for this visit. Since day five, she also wears her engagement ring, a Harry Winston "The One" double halo design: a substantial round center diamond wrapped in two rings of smaller pavé diamonds, with the sparkle continuing down the band itself — the kind of ring people notice from across a room.

[About Mathew ({{user}}):
- Name: Mathew
- Gender: Strictly Male (he/him)
- Role: Cabin host, Ashley's lifelong best friend since childhood, and her newly betrothed fiancé
- Height & Build: 200 cm tall, athletic and fit build, broad-shouldered, towering over Ashley
- Intimate Details: Well-endowed, measuring 22 cm when fully erect and hard
- Relationship Dynamic: Deep childhood history, officially engaged after his proposal on day five; mutual romantic adoration, passionate intimacy, and effortless domestic comfort]`;

    var HARDCODED_SCENARIO =
`Ashley is a 24-year-old commercial flight attendant visiting her childhood best friend, Mathew ({{user}}), at his secluded mountain cabin during a break from flying. On the fifth day of her stay, Mathew proposed and they officially got engaged. Now newly engaged, they're spending their time together celebrating — wrapped up in each other by the fire, in the spa, and reveling in their new commitment, with no set date pulling her away and their future still open to shape together.

[Cabin Setting & Layout:
- Main Floor: Cozy, single-story open-concept cabin. Features a roaring stone fireplace, plush couch, open kitchen, master king-bed, and a walk-in master bathroom.
- Hidden Lower Spa: Accessed via a hidden wooden trapdoor in the living room floor with stone stairs leading down to a private heated pool, cedar sauna, massage table, and spa shower.
- Atmosphere: Deep winter snow outside, completely private and secluded in the mountains.]`;

    var HARDCODED_SYSTEM =
`Write Ashley's next turn in this story with Mathew ({{user}}).

[OUTPUT STRUCTURE - STRICT]
Separate every action paragraph from every dialogue paragraph using double line breaks.

- Actions/narration MUST be enclosed in a single pair of asterisks: *...*
- Spoken dialogue MUST be clean plain text with NO asterisks and NO quotation marks.
- The very first paragraph of every reply MUST be an action.

[ACTION RULE - VERY IMPORTANT]
Ashley writes physical actions as complete first-person sentences.

Every action should normally begin with "I" and use a finite verb.

Correct:
*I gently extricate myself from your embrace and stand up.*
*I look up at you and smile.*
*I reach for your hand.*
*I walk toward the bathroom.*

Incorrect:
*Gently extricating myself from your embrace...*
*Looking up at you...*
*Smiling softly...*
*Reaching for your hand...*
*Walking toward the bathroom...*

Never begin an action paragraph with an -ing participle. Never write an action fragment. Write a complete first-person sentence.

[VOICE]
- Always write as Ashley in first person.
- Speak directly to Mathew using "you" and "your".
- Never refer to Mathew as "he" or "him".
- Never refer to Ashley as "she" or "her" in the actual reply.
- Keep the prose natural, grounded, conversational, and human.
- Avoid purple prose, generic romance-novel wording, and decorative filler.
- Avoid repeatedly describing the same smile, eyes, lips, gaze, happiness, amusement, love, or body movement unless genuinely relevant.
- Vary sentence structure naturally.
- Do not imitate distinctive wording from earlier Ashley messages.

[OUTPUT PURITY - CRITICAL]
Output ONLY Ashley's actual next turn in the scene.

Never output:
- alternative versions
- options
- suggestions
- "Here are alternatives"
- "Here are fresh phrasings"
- "Option 1"
- "Option 2"
- explanations
- commentary about the writing
- character labels
- hashtags
- message numbers
- model notes
- chapter endings
- translations
- random foreign-language text
- text addressed to the developer or user about the generation itself

Never generate meta text. Stay inside the scene.

[REPETITION]
Do not repeat a sentence, distinctive phrase, emotional list, or action pattern from an earlier Ashley reply. Previous messages are continuity only, NOT writing templates.

[LENGTH]
Aim for roughly 300-350 words when the scene naturally supports it. Do not pad the response just to reach the target.

[FORMAT]
Use a natural rhythm of action followed by dialogue followed by action when appropriate. Dialogue can be one or more sentences. Do not force a mechanical alternating pattern when it would make the scene unnatural.`;

    var chatHistory = [];
    var backgroundSummary = "";
    var isGenerating = false;
    var abortController = null;
    var generationStartTime = null;
    var editingMessageIndex = null;

    function applyForcedThemeColor() {
      var metaTheme = document.getElementById('meta-theme-color');

      if (metaTheme) {
        metaTheme.setAttribute('content', '#060a0c');
      }
    }

    function getApiKey() {
      var key = localStorage.getItem('openrouter_api_key');

      if (!key) {
        key = prompt("Enter your OpenRouter API Key:");

        if (key && key.trim()) {
          key = key.trim();
          localStorage.setItem('openrouter_api_key', key);
        }
      }

      return key;
    }

    function init() {
      applyForcedThemeColor();
      getApiKey();

      try {
        var savedChat = localStorage.getItem('ashley_chat_history');

        if (savedChat) {
          chatHistory = JSON.parse(savedChat);

          chatHistory = chatHistory.filter(function(m) {
            return !m.text.includes("Failed to fetch") &&
                   !m.text.includes("Error:") &&
                   !m.text.includes("voluntarily willfully consensually");
          });

          saveChatHistory();
        } else {
          chatHistory.push({
            role: 'char',
            text: HARDCODED_GREETING,
            time: formatTime()
          });

          saveChatHistory();
        }

        backgroundSummary =
          localStorage.getItem('ashley_bg_summary') || "";

      } catch (e) {}

      renderFullChat();
    }

    function saveChatHistory() {
      try {
        localStorage.setItem(
          'ashley_chat_history',
          JSON.stringify(chatHistory)
        );
      } catch (e) {}
    }

    function formatTime() {
      return new Date().toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function autoExpandTextarea(el) {
      el.style.height = 'auto';

      var newHeight =
        Math.min(el.scrollHeight, 120);

      el.style.height =
        (newHeight < 24 ? 24 : newHeight) + 'px';
    }

    function sanitizeText(text) {
      if (!text) return '';

      return text
        .replace(/,\s*(?:I|she)\s+purr(?:s|ed|ing)?(?:[^\n*.]*)?[.]?/gi, '.')
        .replace(/\b(?:I|she)\s+purr(?:s|ed|ing)?(?:[^\n*.]*)?[.]?/gi, '')
        .replace(/,\s*my voice low and satisfied[.]?/gi, '.')
        .replace(/\bmy voice low and satisfied[.]?/gi, '')
        .replace(/proceedings undertaken voluntarily[\s\S]*/gi, '')
        .replace(/Next Turn Notes[\s\S]*/gi, '')
        .replace(/And there ends tonight's chapter[\s\S]*/gi, '')
        .replace(/Yours eternally,[\s\S]*/gi, '')
        .trim();
    }

    /*
      This repairs only a narrow class of broken action openings.

      Stored messages are NOT changed.
      The repair happens only to newly generated text before it is saved.
    */
    function normalizeActionFirstPerson(text) {
      if (!text) return text;

      return text.replace(
        /\*([^*\n]+)\*/g,
        function(full, inner) {
          var a = inner.trim();

          if (!a) {
            return full;
          }

          if (
            /^(?:I|I've|I'm|I'll|I'd)\b/i.test(a)
          ) {
            return '*' + a + '*';
          }

          var rules = [
            [
              /^gently\s+extricating\s+myself\s+/i,
              'I gently extricate myself '
            ],
            [
              /^slowly\s+extricating\s+myself\s+/i,
              'I slowly extricate myself '
            ],
            [
              /^quietly\s+extricating\s+myself\s+/i,
              'I quietly extricate myself '
            ],
            [
              /^gently\s+pulling\s+/i,
              'I gently pull '
            ],
            [
              /^slowly\s+pulling\s+/i,
              'I slowly pull '
            ],
            [
              /^gently\s+turning\s+/i,
              'I gently turn '
            ],
            [
              /^slowly\s+turning\s+/i,
              'I slowly turn '
            ],
            [
              /^looking\s+/i,
              'I look '
            ],
            [
              /^glancing\s+/i,
              'I glance '
            ],
            [
              /^smiling\s+/i,
              'I smile '
            ],
            [
              /^laughing\s+/i,
              'I laugh '
            ],
            [
              /^sighing\s+/i,
              'I sigh '
            ],
            [
              /^standing\s+/i,
              'I stand '
            ],
            [
              /^sitting\s+/i,
              'I sit '
            ],
            [
              /^leaning\s+/i,
              'I lean '
            ],
            [
              /^reaching\s+/i,
              'I reach '
            ],
            [
              /^touching\s+/i,
              'I touch '
            ],
            [
              /^kissing\s+/i,
              'I kiss '
            ],
            [
              /^hugging\s+/i,
              'I hug '
            ],
            [
              /^holding\s+/i,
              'I hold '
            ],
            [
              /^stepping\s+/i,
              'I step '
            ],
            [
              /^walking\s+/i,
              'I walk '
            ],
            [
              /^moving\s+/i,
              'I move '
            ],
            [
              /^closing\s+/i,
              'I close '
            ],
            [
              /^opening\s+/i,
              'I open '
            ],
            [
              /^taking\s+/i,
              'I take '
            ],
            [
              /^placing\s+/i,
              'I place '
            ],
            [
              /^resting\s+/i,
              'I rest '
            ],
            [
              /^tracing\s+/i,
              'I trace '
            ],
            [
              /^brushing\s+/i,
              'I brush '
            ]
          ];

          for (var i = 0; i < rules.length; i++) {
            if (rules[i][0].test(a)) {
              return (
                '*' +
                a.replace(
                  rules[i][0],
                  rules[i][1]
                ) +
                '*'
              );
            }
          }

          return '*' + a + '*';
        }
      );
    }

    function parseMessage(rawText) {
      if (!rawText) return '';

      var clean = sanitizeText(rawText)
        .replace(/<\|.*?\|>/g, '')
        .replace(/~+/g, '')
        .replace(/\*{2,}/g, '*');

      var blocks =
        clean.split(/\n{2,}/);

      var outputHtml = '';

      blocks.forEach(function(block) {
        var trimmed = block.trim();

        if (!trimmed) return;

        if (
          trimmed.startsWith('*') &&
          trimmed.endsWith('*') &&
          trimmed.length > 2 &&
          !trimmed.slice(1, -1).includes('*')
        ) {
          var inner =
            trimmed.slice(1, -1).trim();

          var innerIsQuoted =
            /^["“].*["”]$/.test(inner);

          if (innerIsQuoted) {
            var spoken =
              inner
                .replace(
                  /^["'“”]+|["'“”]+$/g,
                  ''
                )
                .trim();

            if (spoken) {
              outputHtml +=
                '<div class="speech">' +
                escapeHtml(spoken) +
                '</div>';
            }
          } else {
            outputHtml +=
              '<div class="action">' +
              escapeHtml(inner) +
              '</div>';
          }

          return;
        }

        if (trimmed.includes('*')) {
          var parts =
            trimmed.split(/(\*[^*\n]+\*)/g);

          parts.forEach(function(part) {
            var p = part.trim();

            if (!p) return;

            if (
              p.startsWith('*') &&
              p.endsWith('*')
            ) {
              var act =
                p.slice(1, -1).trim();

              if (act) {
                outputHtml +=
                  '<div class="action">' +
                  escapeHtml(act) +
                  '</div>';
              }
            } else {
              var sp =
                p
                  .replace(
                    /^["'“”]+|["'“”]+$/g,
                    ''
                  )
                  .trim();

              if (sp) {
                outputHtml +=
                  '<div class="speech">' +
                  escapeHtml(sp) +
                  '</div>';
              }
            }
          });

          return;
        }

        outputHtml +=
          '<div class="speech">' +
          escapeHtml(
            trimmed
              .replace(
                /^["'“”]+|["'“”]+$/g,
                ''
              )
              .trim()
          ) +
          '</div>';
      });

      return outputHtml;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

          msg.text,
          msg.time,
          msg.duration,
          idx

      });

      stream.scrollTop =
        stream.scrollHeight;
    }

    function showTypingIndicator(statusText) {
      if (
        !document.getElementById(
          'floating-thinking-row'
        )
      ) {
        var stream =
          document.getElementById(
            'chat-stream'
          );

        stream.insertAdjacentHTML(
          'beforeend',
          '<div class="thinking-row" id="floating-thinking-row">' +
          '<div class="thinking-dots">' +
          '<div class="thinking-dot"></div>' +
          '<div class="thinking-dot"></div>' +
          '<div class="thinking-dot"></div>' +
          '</div>' +
          '<span class="thinking-status-text" id="thinking-status-label">' +
          (statusText || "Ashley is thinking...") +
          '</span>' +
          '</div>'
        );

        stream.scrollTop =
          stream.scrollHeight;

      } else {

        var label =
          document.getElementById(
            'thinking-status-label'
          );

        if (label) {
          label.textContent =
            statusText ||
            "Ashley is thinking...";
        }
      }
    }

    function removeTypingIndicator() {
      var e =
        document.getElementById(
          'floating-thinking-row'
        );

      if (e) {
        e.remove();
      }
    }

    function getCurrentTimeContext() {
      var d = new Date();

      return (
        d.toLocaleDateString([], {
          weekday: 'long',
          month: 'long',
          day: 'numeric'
        }) +
        ", " +
        d.toLocaleTimeString([], {
          hour: 'numeric',
          minute: '2-digit'
        })
      );
    }

    function buildOpenRouterMessages() {

      var systemPrompt =
        HARDCODED_SYSTEM +
        "\n\n" +
        HARDCODED_PERSONA +
        "\n\n" +
        HARDCODED_SCENARIO;

      if (
        backgroundSummary &&
        backgroundSummary.trim()
      ) {
        systemPrompt +=
          "\n\n[Persistent Memory — concrete continuity facts only. Use it for established events, relationships, preferences, and setting. Never imitate its wording or prose style: " +
          backgroundSummary +
          "]";
      }

      systemPrompt +=
        "\n\n[HISTORY RULE] The conversation history below exists for continuity only. Previous Ashley replies are not writing examples. Generate fresh wording and fresh sentence structure.";

      systemPrompt +=
        "\n\n[CURRENT DATE/TIME] " +
        getCurrentTimeContext();

      var messages = [
        {
          role: "system",
          content: systemPrompt
        }
      ];

      /*
        IMPORTANT:
        This does NOT delete old messages.
        It only controls how much recent history is sent to the model.
      */
      var recentSlice =
        chatHistory.slice(-20);

      recentSlice.forEach(function(m) {
        var cleanContent =
          sanitizeText(m.text);

        if (cleanContent) {
          messages.push({
            role:
              m.role === 'user'
                ? 'user'
                : 'assistant',
            content: cleanContent
          });
        }
      });

      return messages;
    }

    function handleActionClick() {
      if (isGenerating) {
        stopGeneration();
      } else {
        sendMessage();
      }
    }

    function setStopButtonState(stopping) {
      var btn =
        document.getElementById(
          'actionBtn'
        );

      var icon =
        document.getElementById(
          'actionIcon'
        );

      if (stopping) {

        btn.classList.add(
          'is-stopping'
        );

        icon.innerHTML =
          '<path d="M6 6h12v12H6z"/>';

      } else {

        btn.classList.remove(
          'is-stopping'
        );

        icon.innerHTML =
          '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
      }
    }

    function stopGeneration() {
      if (abortController) {
        abortController.abort();
      }

      isGenerating = false;
      removeTypingIndicator();
      setStopButtonState(false);
      abortController = null;
    }

    async function sendMessage() {
      if (isGenerating) return;

      var input =
        document.getElementById(
          'promptInput'
        );

      var userText =
        input.value.trim();

      if (!userText) return;

      input.value = '';
      input.style.height = '24px';

      chatHistory.push({
        role: 'user',
        text: userText,
        time: formatTime()
      });

      saveChatHistory();
      renderFullChat();

      await triggerAIResponse();
    }

    async function triggerAIResponse() {

      var apiKey = getApiKey();

      if (!apiKey) {
        alert("Please set API key.");
        return;
      }

      isGenerating = true;
      setStopButtonState(true);

      showTypingIndicator(
        "Ashley is thinking..."
      );

      generationStartTime =
        Date.now();

      abortController =
        new AbortController();

      try {

        var response =
          await fetch(
            "https://openrouter.ai/api/v1/chat/completions",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + apiKey,

                "HTTP-Referer":
                  "https://meowoccino.github.io",

                "X-Title":
                  "Ashley PWA"
              },

              signal:
                abortController.signal,

              body:
                JSON.stringify({
                  model:
                    OPENROUTER_MODEL,

                  messages:
                    buildOpenRouterMessages(),

                  max_tokens:
                    500,

                  temperature:
                    0.82,

                  top_p:
                    0.92,

                  frequency_penalty:
                    0.45,

                  presence_penalty:
                    0.25,

                  repetition_penalty:
                    1.08
                })
            }
          );

        if (!response.ok) {
          throw new Error(
            "HTTP " +
            response.status
          );
        }

        var data =
          await response.json();

        var generatedText =
          (
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
          )
            ? data.choices[0].message.content.trim()
            : "";

        generatedText =
          sanitizeText(
            generatedText
              .replace(
                /<\|.*?\|>/g,
                ''
              )
              .replace(
                /~+/g,
                ''
              )
              .trim()
          );

        /*
          Only a deterministic local repair.
          No second API call.
          No "rewrite your last response".
        */
        generatedText =
          normalizeActionFirstPerson(
            generatedText
          );

        if (
          generatedText.length < 40
        ) {
          throw new Error(
            "Response came back too short — likely a dropped or incomplete generation. Try again."
          );
        }

        chatHistory.push({
          role: 'char',
          text: generatedText,
          time: formatTime(),
          duration:
            Math.round(
              (
                Date.now() -
                generationStartTime
              ) / 1000
            ) +
            "s (OpenRouter)"
        });

        saveChatHistory();
        renderFullChat();

        triggerBackgroundSummary();

      } catch (err) {

        if (
          err.name !==
          'AbortError'
        ) {
          alert(
            "Generation Error: " +
            err.message
          );
        }
      }

      removeTypingIndicator();

      isGenerating = false;

      setStopButtonState(false);

      abortController = null;
    }

    async function triggerBackgroundSummary() {

      var lastSummaryAt =
        parseInt(
          localStorage.getItem(
            'ashley_last_summary_count'
          ) || '0',
          10
        );

      if (
        chatHistory.length < 16 ||
        (
          chatHistory.length -
          lastSummaryAt
        ) < 10
      ) {
        return;
      }

      localStorage.setItem(
        'ashley_last_summary_count',
        chatHistory.length.toString()
      );

      var apiKey =
        localStorage.getItem(
          'openrouter_api_key'
        );

      if (!apiKey) return;

      var textToSummarize =
        chatHistory
          .slice(-16, -6)
          .map(function(m) {
            return (
              (
                m.role === 'user'
                  ? 'Mathew'
                  : 'Ashley'
              ) +
              ': ' +
              m.text
            );
          })
          .join('\n');

      var summaryInstruction;

      if (
        backgroundSummary &&
        backgroundSummary.trim()
      ) {

        summaryInstruction =
          "Merge only durable factual continuity into 2-4 short bullet points. Preserve names, relationships, established events, preferences, and setting facts. Never preserve prose style, wording, dialogue, emotional descriptions, narration style, sentence patterns, or repeated phrases." +
          "\n\nExisting:" +
          backgroundSummary +
          "\n\nNew conversation:" +
          textToSummarize;

      } else {

        summaryInstruction =
          "Summarize only durable factual continuity into 2-3 short bullet points. Preserve names, relationships, established events, preferences, and setting facts. Never preserve prose style, wording, dialogue, emotional descriptions, narration style, sentence patterns, or repeated phrases." +
          "\n\nConversation:" +
          textToSummarize;
      }

      try {

        var res =
          await fetch(
            "https://openrouter.ai/api/v1/chat/completions",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + apiKey,

                "HTTP-Referer":
                  "https://meowoccino.github.io",

                "X-Title":
                  "Ashley PWA"
              },

              body:
                JSON.stringify({
                  model:
                    OPENROUTER_SUMMARY_MODEL,

                  messages: [
                    {
                      role: "system",

                      content:
                        "Write extremely concise factual memory bullets. Store only durable facts and continuity. Never store prose wording, dialogue, narration style, emotional descriptions, repeated phrases, sentence patterns, or writing style. No commentary."
                    },
                    {
                      role: "user",
                      content:
                        summaryInstruction
                    }
                  ],

                  max_tokens:
                    150,

                  temperature:
                    0.3
                })
            }
          );

        if (!res.ok) {
          return;
        }

        var data =
          await res.json();

        if (
          data.choices &&
          data.choices[0] &&
          data.choices[0].message
        ) {

          var newSummary =
            data.choices[0]
              .message
              .content
              .trim();

          if (
            newSummary &&
            !/here are (?:some )?(?:alternatives|fresh phrasings|options)/i.test(
              newSummary
            )
          ) {
            backgroundSummary =
              newSummary;

            localStorage.setItem(
              'ashley_bg_summary',
              backgroundSummary
            );
          }
        }

      } catch (e) {}
    }

    function deleteMessage(idx) {
      if (isGenerating) return;

      chatHistory.splice(
        idx,
        1
      );

      saveChatHistory();
      renderFullChat();
    }

    /*
      RETRY BEHAVIOR:

      If idx points to Ashley's reply:
      - keep the user's message immediately before it
      - keep all earlier messages
      - remove Ashley's reply and anything after it
      - generate again

      This is the correct behavior for the Retry icon.
    */
    async function regenerateMessage(idx) {

      if (isGenerating) return;

      if (
        !chatHistory[idx] ||
        chatHistory[idx].role !== 'char'
      ) {
        return;
      }

      chatHistory.splice(idx);

      saveChatHistory();
      renderFullChat();

      await triggerAIResponse();
    }

    function openMemoryModal() {

      var summaryEl =
        document.getElementById(
          'memorySummaryDisplay'
        );

      if (
        backgroundSummary &&
        backgroundSummary.trim()
      ) {

        summaryEl.textContent =
          backgroundSummary;

        summaryEl.classList.remove(
          'memory-block-empty'
        );

      } else {

        summaryEl.textContent =
          'Empty — nothing stored yet.';

        summaryEl.classList.add(
          'memory-block-empty'
        );
      }

      document.getElementById(
        'chatHistoryCountDisplay'
      ).textContent =
        chatHistory.length +
        ' messages saved.';

      document.getElementById(
        'memory-sheet'
      ).style.display = 'flex';
    }

    function closeMemoryModal(e) {

      if (
        e &&
        e.target &&
        e.target.id !== 'memory-sheet'
      ) {
        return;
      }

      document.getElementById(
        'memory-sheet'
      ).style.display = 'none';
    }

    function clearMemorySummary() {

      if (
        !confirm(
          'Clear the stored memory summary? This cannot be undone.'
        )
      ) {
        return;
      }

      backgroundSummary = '';

      localStorage.setItem(
        'ashley_bg_summary',
        ''
      );

      openMemoryModal();
    }

    function clearAllChatHistory() {

      if (
        !confirm(
          'Delete ALL messages? This cannot be undone.'
        )
      ) {
        return;
      }

      chatHistory = [];

      saveChatHistory();

      localStorage.setItem(
        'ashley_last_summary_count',
        '0'
      );

      renderFullChat();
      closeMemoryModal();
    }

    function openEditModal(idx) {

      if (isGenerating) return;

      editingMessageIndex = idx;

      document.getElementById(
        'edit-sheet-title'
      ).innerText =
        chatHistory[idx].role === 'user'
          ? 'Edit Your Message'
          : "Edit Ashley's Message";

      document.getElementById(
        'editMessageTextarea'
      ).value =
        chatHistory[idx].text;

      document.getElementById(
        'edit-sheet'
      ).style.display = 'flex';
    }

    function closeEditModal(e) {

      if (
        e &&
        e.target &&
        e.target.id !== 'edit-sheet'
      ) {
        return;
      }

      document.getElementById(
        'edit-sheet'
      ).style.display = 'none';

      editingMessageIndex = null;
    }

    async function saveEditedMessage() {

      if (
        editingMessageIndex === null ||
        isGenerating
      ) {
        return;
      }

      var newText =
        document.getElementById(
          'editMessageTextarea'
        ).value.trim();

      if (!newText) return;

      var targetRole =
        chatHistory[
          editingMessageIndex
        ].role;

      var targetIdx =
        editingMessageIndex;

      document.getElementById(
        'edit-sheet'
      ).style.display = 'none';

      editingMessageIndex = null;

      if (
        targetRole === 'user'
      ) {

        /*
          Editing a user message intentionally
          creates a new branch from that point.
          Earlier messages stay intact.
        */
        chatHistory.splice(
          targetIdx
        );

        chatHistory.push({
          role: 'user',
          text: newText,
          time: formatTime()
        });

        saveChatHistory();
        renderFullChat();

        await triggerAIResponse();

      } else {

        /*
          Editing Ashley only changes that message.
          Nothing else is deleted.
        */
        chatHistory[targetIdx].text =
          newText;

        saveChatHistory();
        renderFullChat();
      }
    }

    function openLightbox() {
      document.getElementById(
        'avatar-lightbox'
      ).style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById(
        'avatar-lightbox'
      ).style.display = 'none';
    }

    var appContainer =
      document.getElementById(
        'app-container'
      );

    var promptInput =
      document.getElementById(
        'promptInput'
      );

    var chatStream =
      document.getElementById(
        'chat-stream'
      );

    function adjustViewport() {

      appContainer.style.height =
        window.visualViewport
          ? window.visualViewport.height + 'px'
          : window.innerHeight + 'px';

      chatStream.scrollTop =
        chatStream.scrollHeight;
    }

    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        'resize',
        adjustViewport
      );

      window.visualViewport.addEventListener(
        'scroll',
        adjustViewport
      );

    } else {

      window.addEventListener(
        'resize',
        adjustViewport
      );
    }

    promptInput.addEventListener(
      'focus',
      function() {
        setTimeout(
          function() {
            adjustViewport();

            chatStream.scrollTop =
              chatStream.scrollHeight;
          },
          250
        );
      }
    );

    /*
      INTENTIONAL BEHAVIOR:
      Insert ** and put the cursor between the two asterisks.
    */
    function insertActionWrapper() {

      var start =
        promptInput.selectionStart;

      var end =
        promptInput.selectionEnd;

      var val =
        promptInput.value;

      promptInput.value =
        val.substring(0, start) +
        "**" +
        val.substring(end);

      promptInput.focus();

      promptInput.setSelectionRange(
        start + 1,
        start + 1
      );

      autoExpandTextarea(
        promptInput
      );
    }

    promptInput.addEventListener(
      'keydown',
      function(e) {
        if (e.key === 'Enter') {
          setTimeout(
            function() {
              autoExpandTextarea(
                promptInput
              );
            },
            10
          );
        }
      }
    );

    window.addEventListener(
      'DOMContentLoaded',
      init
    );

    if (
      'serviceWorker' in navigator
    ) {

      window.addEventListener(
        'load',
        function() {

          navigator.serviceWorker
            .register(
              './sw.js?v=12'
            )
            .then(function(reg) {
              reg.update();
            })
            .catch(function() {});

        }
      );
    }
  </script>
</body>
</html>
