<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090c;
      --char-bubble: rgba(18, 22, 32, 0.94);
      --char-border: rgba(212, 175, 122, 0.22);
      --user-bubble: rgba(34, 25, 18, 0.94);
      --user-border: rgba(224, 160, 96, 0.35);
      --gold-accent: #d4af7a;
      --action-color: #e2c4a2;
      --speech-text: #f5f2ed;
      --quoted-rose: #e5b2aa; /* 4. Soft Rose Dusk for 'quoted' phrases */
      --text-dim: #8b92a2;
      --danger-color: #e06c75;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--speech-text); font-family: 'Plus Jakarta Sans', sans-serif; }

    #app-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 12%, #141722 0%, #090a0f 65%, #040507 100%);
      pointer-events: none;
    }

    #ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #chat-stream {
      flex: 1;
      position: relative;
      z-index: 5;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .msg-group.ashley {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      padding-right: 4px;
    }
    .msg-group.ashley .ashley-wrapper {
      max-width: 96%;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 8px;
    }

    .msg-group.user {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      padding-left: 14%;
    }
    .msg-group.user .user-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .ashley-msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold-accent);
      flex-shrink: 0;
      margin-top: 4px;
      cursor: pointer;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .glass-bubble {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      font-size: 0.95rem;
      line-height: 1.62;
      word-break: break-word;
    }
    .ashley .glass-bubble {
      background: var(--char-bubble);
      border: 1px solid var(--char-border);
      border-top-right-radius: 4px;
      border-top-left-radius: 18px;
    }
    .user .glass-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-top-right-radius: 4px;
    }

    .action {
      display: block;
      color: var(--action-color);
      font-style: italic;
      font-weight: 300;
      margin-bottom: 10px;
    }
    .speech {
      display: block;
      color: var(--speech-text);
      font-weight: 400;
      margin-bottom: 10px;
    }
    .action:last-child, .speech:last-child { margin-bottom: 0; }

    /* Single quoted transformation: Soft Rose Dusk (No italics, regular upright text) */
    .quoted-text {
      color: var(--quoted-rose);
      font-style: normal;
      font-weight: 500;
    }

    /* Metadata Bar Layout */
    .meta-time-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      margin-top: 6px;
      padding: 0 6px;
      color: var(--text-dim);
    }
    
    /* Mathew controls: Pinned LEFT */
    .user .meta-time-row {
      align-self: flex-start;
      margin-left: 2px;
    }

    /* Ashley controls: Pinned RIGHT */
    .ashley .meta-time-row {
      align-self: flex-end;
      margin-right: 6px;
    }

    .meta-time-row svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

    .msg-action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 5px;
      border-radius: 4px;
    }
    .msg-action-btn:active { color: var(--gold-accent); }
    .msg-action-btn.delete-btn:active { color: var(--danger-color); }
    .msg-action-btn svg { width: 13px; height: 13px; }

    .msg-counter {
      font-size: 0.68rem;
      color: var(--text-dim);
      opacity: 0.75;
      font-weight: 500;
    }

    /* Floating Thinking Indicator (No Box) */
    .thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      animation: fadeIn 0.3s ease;
    }
    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .thinking-dot {
      width: 6px;
      height: 6px;
      background: var(--gold-accent);
      border-radius: 50%;
      opacity: 0.35;
      animation: pulseDot 1.4s infinite ease-in-out;
    }
    .thinking-dot:nth-child(1) { animation-delay: 0s; }
    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

    .thinking-status-text {
      font-size: 0.76rem;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      font-style: italic;
    }

    @keyframes pulseDot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.18); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Edit Sheet Overlay */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: flex-end;
    }
    .sheet-content {
      width: 100%;
      max-height: 75vh;
      background: #12141c;
      border-top: 1px solid var(--char-border);
      border-radius: 24px 24px 0 0;
      padding: 22px 18px 34px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sheet-title {
      font-size: 0.78rem;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .edit-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px;
      color: var(--speech-text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 120px;
      outline: none;
      line-height: 1.5;
    }
    .sheet-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .sheet-save-btn {
      flex: 1;
      background: var(--gold-accent);
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #12100d;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .sheet-cancel-btn {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 8px 12px 14px;
      background: transparent;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .dock-input {
      flex: 1;
      background: rgba(12, 14, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 8px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 42px;
    }

    .dock-input textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      height: 24px;
      max-height: 120px;
      line-height: 1.4;
      padding: 2px 0;
      overflow-y: auto;
      display: block;
      caret-color: var(--gold-accent);
      text-decoration-skip-ink: none;
    }

    /* Red wavy underline for native spelling/grammar issues */
    .dock-input textarea::spelling-error {
      text-decoration: underline wavy var(--danger-color);
    }
    .dock-input textarea::grammar-error {
      text-decoration: underline wavy var(--danger-color);
    }

    .action-symbol-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.95rem;
      padding: 4px 6px;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .action-symbol-btn:active { color: var(--action-color); }

    .send-pill {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dfb479, #b88b48);
      border: none;
      color: #12100d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, border-radius 0.2s ease;
    }

    .send-pill.is-stopping {
      background: #3a2224;
      border: 1.5px solid var(--danger-color);
      color: var(--danger-color);
      border-radius: 14px;
    }

    #avatar-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-frame {
      max-width: 90vw;
      max-height: 78vh;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, var(--gold-accent), transparent 75%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      overflow: hidden;
    }

    .lightbox-frame img {
      width: 100%;
      height: 100%;
      max-height: 76vh;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    .icon { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>

    /* Transform single-quoted words/phrases into Soft Rose Dusk span without quotes */
    function applyQuoteColor(text) {
      return text.replace(/(^|[\s(])'([^'\n]+)'([.,!?\s)]|$)/g, '$1<span class="quoted-text">$2</span>$3');
    }

    function parseMessage(rawText) {
      if (!rawText) return '';
      var clean = rawText.replace(/<\|.*?\|>/g, '').trim();
      var blocks = clean.split(/\n{2,}/);
      var outputHtml = '';

      blocks.forEach(function(block) {
        var trimmed = block.trim();
        if (!trimmed) return;

        if (/^\*[^*]+(\*|$)/.test(trimmed) && trimmed.endsWith('*')) {
          var cleanAction = trimmed.replace(/^\*+|\*+$/g, '').trim();

            if (!subTrim) return;
            if (subTrim.startsWith('*') && subTrim.endsWith('*')) {

              outputHtml += '<span class="action">' + applyQuoteColor(cleanSub) + '</span>';

              outputHtml += '<span class="speech">' + applyQuoteColor(speechClean) + '</span>';

          outputHtml += '<span class="speech">' + applyQuoteColor(unquoted) + '</span>';

      });

      return outputHtml;

          '<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7z"/></svg><span>' +
          metaStr + '</span>' +
          '<button class="msg-action-btn" onclick="openEditModal(' + idx + ')" title="Edit message"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>' +
          '<button class="msg-action-btn delete-btn" onclick="deleteMessage(' + idx + ')" title="Delete message"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>' +
          '</div></div></div>';
      } else {
        /* Ashley's controls pinned to RIGHT */
        var footerContent = '';
        if (idx > 0) {
          footerContent = '<div class="meta-time-row">' + msgCountLabel +
            '<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7z"/></svg><span>' +
            metaStr + '</span>' +
            '<button class="msg-action-btn" onclick="regenerateMessage(' + idx + ')" title="Reroll message"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>' +
            '<button class="msg-action-btn" onclick="openEditModal(' + idx + ')" title="Edit message"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>' +
            '<button class="msg-action-btn delete-btn" onclick="deleteMessage(' + idx + ')" title="Delete message"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>' +
            '</div>';
        } else {
          footerContent = '<div class="meta-time-row">' + msgCountLabel + '</div>';
        }

        html = '<div class="msg-group ashley" id="msg-' + idx + '"><div class="ashley-wrapper">' +
          '<div class="bubble-wrapper"><div class="glass-bubble">' + parseMessage(text) + '</div>' + footerContent + '</div>' +
          '<img class="ashley-msg-avatar" src="./ashley.png" onclick="openLightbox()" onerror="this.src=\'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80\'">' +
          '</div></div>';
      }
      stream.insertAdjacentHTML('beforeend', html);
      stream.scrollTop = stream.scrollHeight;
    }

    function showTypingIndicator() {
      if (document.getElementById('floating-thinking-row')) return;
      var stream = document.getElementById('chat-stream');
      var html = '<div class="thinking-row" id="floating-thinking-row">' +
        '<div class="thinking-dots"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>' +
        '<span class="thinking-status-text" id="thinking-status-label">Contacting Horde...</span>' +
        '</div>';
      stream.insertAdjacentHTML('beforeend', html);
      stream.scrollTop = stream.scrollHeight;
    }

    function removeTypingIndicator() {
      var elem = document.getElementById('floating-thinking-row');
      if (elem) elem.remove();
    }

    function updateTypingStatus(text) {
      var statusElem = document.getElementById('thinking-status-label');
      if (statusElem) {
        statusElem.innerText = text;
      }
    }

    function buildHordePrompt() {
      var prompt = HARDCODED_SYSTEM + "\n\n" + HARDCODED_PERSONA + "\n\n" + HARDCODED_SCENARIO + "\n\n";

      if (backgroundSummary) {
        prompt += "[Persistent Context / History Summary: " + backgroundSummary + "]\n\n";
      }

      prompt += HARDCODED_EXAMPLES + "\n\n";

      var recent = chatHistory.slice(-10);
      recent.forEach(function(m) {
        prompt += (m.role === 'user' ? 'Mathew: ' : 'Ashley: ') + m.text + "\n\n";
      });

      prompt += HARDCODED_INPUT_SUFFIX;
      return prompt;
    }

    function handleActionClick() {
      if (isGenerating) {
        stopGeneration();
      } else {
        sendMessage();
      }
    }

    function setStopButtonState(stopping) {
      var btn = document.getElementById('actionBtn');
      var icon = document.getElementById('actionIcon');
      if (stopping) {
        btn.classList.add('is-stopping');
        icon.innerHTML = '<path d="M6 6h12v12H6z"/>';
      } else {
        btn.classList.remove('is-stopping');
        icon.innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
      }
    }

    function stopGeneration() {
      abortActive = true;
      isGenerating = false;
      isCompleted = true;
      activeHordeRequestId = null;
      localStorage.removeItem('pending_horde_id');
      localStorage.removeItem('pending_horde_start');
      removeTypingIndicator();
      setStopButtonState(false);
    }

    async function sendMessage() {
      if (isGenerating) return;
      var input = document.getElementById('promptInput');
      var userText = input.value.trim();
      if (!userText) return;

      input.value = '';
      input.style.height = '24px';
      var userTime = formatTime();
      chatHistory.push({ role: 'user', text: userText, time: userTime });
      saveChatHistory();
      renderFullChat();

      await triggerAIResponse();
    }

    async function triggerAIResponse() {
      isGenerating = true;
      abortActive = false;
      isCompleted = false;
      setStopButtonState(true);
      showTypingIndicator();

      var promptPayload = buildHordePrompt();
      generationStartTime = Date.now();

      try {
        var postRes = await fetch("https://aihorde.net/api/v2/generate/text/async", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": HARDCODED_API_KEY },
          body: JSON.stringify({
            prompt: promptPayload,
            params: {
              max_context_length: HARDCODED_CONTEXT,
              max_length: HARDCODED_MAX_TOKENS,
              temperature: HARDCODED_TEMP,
              rep_pen: 1.15,
              stop_sequence: ["\nMathew:", "\n{{user}}:", "\nUser:"]
            },
            models: [HARDCODED_MODEL]
          })
        });

        var postData = await postRes.json();
        if (!postData.id) {
          throw new Error(postData.message || "Failed to enqueue request with Horde.");
        }

        activeHordeRequestId = postData.id;
        localStorage.setItem('pending_horde_id', activeHordeRequestId);
        localStorage.setItem('pending_horde_start', generationStartTime);

        await pollHordeResult(activeHordeRequestId);
      } catch (err) {
        handleGenerationError(err);
      }
    }

    async function resumePolling(requestId) {
      isGenerating = true;
      abortActive = false;
      isCompleted = false;
      setStopButtonState(true);
      showTypingIndicator();
      await pollHordeResult(requestId);
    }

    async function pollHordeResult(requestId) {
      try {
        var generatedText = "";
        while (!isCompleted && !abortActive) {
          await new Promise(function(r) { setTimeout(r, 2000); });
          if (abortActive || isCompleted) return;

          var checkRes = await fetch("https://aihorde.net/api/v2/generate/text/status/" + requestId);
          var checkData = await checkRes.json();

          if (isCompleted || abortActive) return;

          if (checkData.wait_time) {
            updateTypingStatus("Waiting in queue (~" + checkData.wait_time + "s)...");
          } else if (checkData.processing) {
            updateTypingStatus("Ashley is typing...");
          }

          if (checkData.done) {
            generatedText = checkData.generations[0].text.trim();
            isCompleted = true;
            break;
          }
          if (checkData.faulted) {
            throw new Error("Horde worker faulted");
          }
        }

        if (abortActive) return;

        removeTypingIndicator();
        var durationSec = Math.round((Date.now() - (generationStartTime || Date.now())) / 1000) + "s";
        chatHistory.push({ role: 'char', text: generatedText, time: formatTime(), duration: durationSec });
        saveChatHistory();
        renderFullChat();

        localStorage.removeItem('pending_horde_id');
        localStorage.removeItem('pending_horde_start');
        activeHordeRequestId = null;

        triggerBackgroundSummary();
      } catch (err) {
        handleGenerationError(err);
      } finally {
        isGenerating = false;
        setStopButtonState(false);
      }
    }

    function handleGenerationError(err) {
      if (isCompleted || abortActive) return;
      removeTypingIndicator();
      localStorage.removeItem('pending_horde_id');
      localStorage.removeItem('pending_horde_start');
      activeHordeRequestId = null;

      var errText = "*Ashley shivers as the wind howls against the window pane.* (" + (err.message || "Connection interrupted. Tap reroll to retry.") + ")";
      chatHistory.push({ role: 'char', text: errText, time: formatTime(), duration: "Error" });
      saveChatHistory();
      renderFullChat();
      
      isGenerating = false;
      setStopButtonState(false);
    }

    /* Fixed visibilitychange listener to eliminate duplicate error races */
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && activeHordeRequestId && isGenerating && !isCompleted) {
        fetch("https://aihorde.net/api/v2/generate/text/status/" + activeHordeRequestId)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.done && !isCompleted) {
              isCompleted = true;
              removeTypingIndicator();
              var text = data.generations[0].text.trim();
              var durationSec = Math.round((Date.now() - (generationStartTime || Date.now())) / 1000) + "s";
              chatHistory.push({ role: 'char', text: text, time: formatTime(), duration: durationSec });
              saveChatHistory();
              renderFullChat();
              localStorage.removeItem('pending_horde_id');
              localStorage.removeItem('pending_horde_start');
              activeHordeRequestId = null;
              isGenerating = false;
              setStopButtonState(false);
            }
          }).catch(function() {});
      }
    });

    function deleteMessage(idx) {
      if (isGenerating) return;
      chatHistory.splice(idx, 1);
      saveChatHistory();
      renderFullChat();
    }

    async function regenerateMessage(idx) {
      if (isGenerating) return;
      chatHistory.splice(idx, 1);
      saveChatHistory();
      renderFullChat();
      await triggerAIResponse();
    }

    function openEditModal(idx) {
      if (isGenerating) return;
      editingMessageIndex = idx;
      var msg = chatHistory[idx];
      var titleText = msg.role === 'user' ? 'Edit Your Message' : "Edit Ashley's Message";
      document.getElementById('edit-sheet-title').innerText = titleText;
      document.getElementById('editMessageTextarea').value = msg.text;
      document.getElementById('edit-sheet').style.display = 'flex';
    }

    function closeEditModal(e) {
      if (e && e.target && e.target.id !== 'edit-sheet') return;
      document.getElementById('edit-sheet').style.display = 'none';
      editingMessageIndex = null;
    }

    async function saveEditedMessage() {
      if (editingMessageIndex === null || isGenerating) return;
      var newText = document.getElementById('editMessageTextarea').value.trim();
      if (!newText) return;

      var targetRole = chatHistory[editingMessageIndex].role;
      var targetIdx = editingMessageIndex;

      document.getElementById('edit-sheet').style.display = 'none';
      editingMessageIndex = null;

      if (targetRole === 'user') {
        chatHistory.splice(targetIdx);
        chatHistory.push({ role: 'user', text: newText, time: formatTime() });
        saveChatHistory();
        renderFullChat();
        await triggerAIResponse();
      } else {
        chatHistory[targetIdx].text = newText;
        saveChatHistory();
        renderFullChat();
      }
    }

    function openLightbox() {
      document.getElementById('avatar-lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('avatar-lightbox').style.display = 'none';
    }

    async function triggerBackgroundSummary() {
      if (chatHistory.length < 14 || chatHistory.length % 10 !== 0) return;
      var olderSlice = chatHistory.slice(-14, -6);
      var textToSummarize = olderSlice.map(function(m) { return (m.role === 'user' ? 'Mathew' : 'Ashley') + ': ' + m.text; }).join('\n');

      var prompt = "[System: Extract in 3 concise bullet points any permanent facts, purchased items, secrets, or changes in relationship:]\n" + textToSummarize + "\nKey facts:";

      try {
        var res = await fetch("https://aihorde.net/api/v2/generate/text/async", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": HARDCODED_API_KEY },
          body: JSON.stringify({
            prompt: prompt,
            params: { max_length: 80, temperature: 0.3 },
            models: ["APHODITE-Llama-3-8B", "koboldcpp/L3-8B-Stheno-v3.2"]
          })
        });
        var data = await res.json();
        var reqId = data.id;

        while (true) {
          await new Promise(function(r) { setTimeout(r, 2500); });
          var poll = await fetch("https://aihorde.net/api/v2/generate/text/status/" + reqId);
          var pollData = await poll.json();
          if (pollData.done) {
            backgroundSummary = (backgroundSummary + " " + pollData.generations[0].text).trim();
            localStorage.setItem('ashley_bg_summary', backgroundSummary);
            break;
          }
          if (pollData.faulted) break;
        }
      } catch (e) {}
    }

    var appContainer = document.getElementById('app-container');
    var promptInput = document.getElementById('promptInput');
    var chatStream = document.getElementById('chat-stream');

    function adjustViewport() {
      if (window.visualViewport) {
        appContainer.style.height = window.visualViewport.height + 'px';
      } else {
        appContainer.style.height = window.innerHeight + 'px';
      }
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', adjustViewport);
      window.visualViewport.addEventListener('scroll', adjustViewport);
    } else {
      window.addEventListener('resize', adjustViewport);
    }

    promptInput.addEventListener('focus', function() {
      setTimeout(function() {
        adjustViewport();
        chatStream.scrollTop = chatStream.scrollHeight;
      }, 250);
    });

    var canvas = document.getElementById('ambient-canvas');
    var ctx = canvas.getContext('2d');
    var width = canvas.width = window.innerWidth;
    var height = canvas.height = window.innerHeight;

    window.addEventListener('resize', function() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    var motes = [];
    for (var i = 0; i < 18; i++) {
      motes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.2 + 0.5,
        speedY: (Math.random() * 0.15 + 0.05) * -1,
        speedX: (Math.random() - 0.5) * 0.1,
        opacity: Math.random() * 0.18 + 0.08
      });
    }

    function drawAmbiance() {
      ctx.clearRect(0, 0, width, height);
      for (var j = 0; j < motes.length; j++) {
        var m = motes[j];
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(212, 175, 122, " + m.opacity + ")";
        ctx.fill();
        m.y += m.speedY;
        m.x += m.speedX;
        if (m.y < 0) { m.y = height + 5; m.x = Math.random() * width; }
      }
      requestAnimationFrame(drawAmbiance);
    }
    drawAmbiance();

    function insertActionWrapper() {
      var start = promptInput.selectionStart;
      var end = promptInput.selectionEnd;
      var val = promptInput.value;
      promptInput.value = val.substring(0, start) + "**" + val.substring(end);
      promptInput.focus();
      promptInput.setSelectionRange(start + 1, start + 1);
      autoExpandTextarea(promptInput);
    }

    promptInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        setTimeout(function() {
          autoExpandTextarea(promptInput);
        }, 10);
      }
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
