<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ashley</title>

  <meta name="theme-color" content="#060a0c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060a0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" id="meta-theme-color" content="#060a0c">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ashley">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <link rel="manifest" href="./manifest.json?v=12">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060a0c;
      --char-bubble: rgba(14, 24, 28, 0.88);
      --char-border: rgba(45, 140, 125, 0.28);
      --user-bubble: rgba(30, 24, 20, 0.88);
      --user-border: rgba(224, 160, 96, 0.35);
      --gold-accent: #d4af7a;
      --action-color: #e2c4a2;
      --speech-text: #f5f2ed;
      --text-dim: #889a9f;
      --danger-color: #e06c75;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      background-color: #060a0c;
      height: 100%;
    }
    
    body { 
      width: 100%; 
      height: 100%; 
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden; 
      background-color: #060a0c; 
      color: var(--speech-text); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }

    #app-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(circle at 85% 15%, rgba(14, 95, 82, 0.72) 0%, transparent 60%),
        radial-gradient(circle at 15% 85%, rgba(12, 65, 80, 0.6) 0%, transparent 65%),
        linear-gradient(180deg, #071517 0%, #060a0c 50%, #040708 100%);
      pointer-events: none;
    }

    #chat-stream {
      flex: 1;
      position: relative;
      z-index: 5;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .msg-group {
      display: flex;
      width: 100%;
      animation: softExpand 0.32s cubic-bezier(0.2, 1, 0.4, 1) forwards;
    }

    @keyframes softExpand {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .msg-group.ashley {
      justify-content: flex-start;
      padding-right: 4px;
    }

    .msg-group.ashley .ashley-wrapper {
      max-width: 96%;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 8px;
    }

    .msg-group.user {
      justify-content: flex-end;
      padding-left: 14%;
    }

    .msg-group.user .user-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .ashley-msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold-accent);
      flex-shrink: 0;
      margin-top: 4px;
      cursor: pointer;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .glass-bubble {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.45);
      font-size: 0.95rem;
      word-break: break-word;
    }

    .ashley .glass-bubble {
      background: var(--char-bubble);
      border: 1px solid var(--char-border);
      border-top-right-radius: 4px;
      border-top-left-radius: 18px;
    }

    .user .glass-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-top-right-radius: 4px;
    }

    .action {
      display: block;
      color: var(--action-color);
      font-style: italic;
      font-weight: 300;
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .speech {
      display: block;
      color: var(--speech-text);
      font-style: normal;
      font-weight: 400;
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .action:last-child,
    .speech:last-child {
      margin-bottom: 0;
    }

    .meta-time-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      margin-top: 6px;
      padding: 0 6px;
      color: var(--text-dim);
    }

    .user .meta-time-row {
      align-self: flex-start;
      margin-left: 2px;
    }

    .ashley .meta-time-row {
      align-self: flex-end;
      margin-right: 6px;
    }

    .meta-time-row svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .msg-action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 5px;
      border-radius: 4px;
    }

    .msg-action-btn:active {
      color: var(--gold-accent);
    }

    .msg-action-btn.delete-btn:active {
      color: var(--danger-color);
    }

    .msg-action-btn svg {
      width: 13px;
      height: 13px;
    }

    .msg-counter {
      font-size: 0.68rem;
      color: var(--text-dim);
      opacity: 0.75;
      font-weight: 500;
    }

    .thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      animation: fadeIn 0.3s ease;
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      background: var(--gold-accent);
      border-radius: 50%;
      opacity: 0.35;
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    .thinking-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    .thinking-status-text {
      font-size: 0.76rem;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      font-style: italic;
    }

    @keyframes pulseDot {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.85);
      }
      40% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: flex-end;
    }

    .sheet-content {
      width: 100%;
      max-height: 75vh;
      background: #0f1719;
      border-top: 1px solid var(--char-border);
      border-radius: 24px 24px 0 0;
      padding: 22px 18px calc(34px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-title {
      font-size: 0.78rem;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .edit-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px;
      color: var(--speech-text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 120px;
      outline: none;
      line-height: 1.5;
    }

    .sheet-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .sheet-save-btn {
      flex: 1;
      background: var(--gold-accent);
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #12100d;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .sheet-cancel-btn {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 8px 12px calc(14px + env(safe-area-inset-bottom, 0px));
      background: transparent;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .dock-input {
      flex: 1;
      background: rgba(10, 18, 20, 0.95);
      border: 1px solid rgba(45, 140, 125, 0.2);
      border-radius: 22px;
      padding: 8px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 42px;
    }

    .dock-input textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      height: 24px;
      max-height: 120px;
      line-height: 1.4;
      padding: 2px 0;
      overflow-y: auto;
      display: block;
      caret-color: var(--gold-accent);
    }

    .action-symbol-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.95rem;
      padding: 4px 6px;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .action-symbol-btn:active {
      color: var(--action-color);
    }

    .send-pill {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dfb479, #b88b48);
      border: none;
      color: #12100d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, border-radius 0.2s ease;
    }

    .send-pill.is-stopping {
      background: #3a2224;
      border: 1.5px solid var(--danger-color);
      color: var(--danger-color);
      border-radius: 14px;
    }

    #avatar-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 10, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-frame {
      max-width: 90vw;
      max-height: 78vh;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, var(--gold-accent), transparent 75%);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }

    .memory-fab {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 500;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(12, 14, 20, 0.85);
      border: 1px solid var(--char-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .memory-fab svg {
      width: 18px;
      height: 18px;
    }

    .memory-block {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
    }

    .memory-block-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .memory-block-body {
      font-size: 0.88rem;
      color: var(--speech-text);
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
    }

    .memory-block-empty {
      color: var(--text-dim);
      font-style: italic;
    }

    .memory-clear-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .lightbox-frame img {
      width: 100%;
      height: 100%;
      max-height: 76vh;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>

<body>
  <div id="ambient-bg"></div>

  <div id="app-container">
    <button type="button" class="memory-fab" onclick="openMemoryModal()" title="View stored data">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13.5"/>
        <path d="M6.5 21H18a2 2 0 0 0 2-2v-1H6.5a1.5 1.5 0 0 0 0 3Z"/>
        <circle cx="12.5" cy="9" r="1" fill="var(--gold-accent)" stroke="none"/>
      </svg>
    </button>

    <main id="chat-stream"></main>

    <footer id="input-footer">
      <div class="dock-input">
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Type a message or action..."
          spellcheck="true"
          autocorrect="on"
          autocomplete="on"
          autocapitalize="sentences"
          oninput="autoExpandTextarea(this)"
        ></textarea>

        <!-- INTENTIONAL: inserts ** and places cursor between them -->
        <button
          type="button"
          class="action-symbol-btn"
          onclick="insertActionWrapper()"
        >* *</button>
      </div>

      <button
        type="button"
        class="send-pill"
        id="actionBtn"
        onclick="handleActionClick()"
      >
        <svg id="actionIcon" class="icon" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>
  </div>

  <div id="edit-sheet" class="sheet-overlay" onclick="closeEditModal(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-title" id="edit-sheet-title">Edit Message</div>

      <textarea
        id="editMessageTextarea"
        class="edit-textarea"
        spellcheck="true"
        autocorrect="on"
      ></textarea>

      <div class="sheet-btn-row">
        <button
          type="button"
          class="sheet-cancel-btn"
          onclick="closeEditModal()"
        >Cancel</button>

        <button
          type="button"
          class="sheet-save-btn"
          onclick="saveEditedMessage()"
        >Save</button>
      </div>
    </div>
  </div>

  <div id="memory-sheet" class="sheet-overlay" onclick="closeMemoryModal(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-title">Stored Data</div>

      <div class="memory-block">
        <div class="memory-block-label">Memory Summary</div>
        <div class="memory-block-body" id="memorySummaryDisplay"></div>
        <button
          type="button"
          class="memory-clear-btn"
          onclick="clearMemorySummary()"
        >Clear Memory Summary</button>
      </div>

      <div class="memory-block">
        <div class="memory-block-label">Chat History</div>
        <div class="memory-block-body" id="chatHistoryCountDisplay"></div>
        <button
          type="button"
          class="memory-clear-btn"
          onclick="clearAllChatHistory()"
        >Clear All Messages</button>
      </div>

      <div class="sheet-btn-row">
        <button
          type="button"
          class="sheet-cancel-btn"
          onclick="closeMemoryModal()"
        >Close</button>
      </div>
    </div>
  </div>

  <div id="avatar-lightbox" onclick="closeLightbox()">
    <div class="lightbox-frame" onclick="event.stopPropagation()">
      <img
        src="./ashley.png"
        onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80'"
        alt=""
      >
    </div>
  </div>

  <script>
    var OPENROUTER_MODEL = "nousresearch/hermes-3-llama-3.1-405b";
    var OPENROUTER_SUMMARY_MODEL = "meta-llama/llama-3.3-70b-instruct:free";

    var HARDCODED_GREETING =
`*The heavy cabin door pushes open, letting in a brief gust of freezing mountain wind before I quickly pull it shut. I drop my roller suitcase and airline shoulder bag on the entryway mat, exhaling a long, frosty breath that instantly fogs up.*

*Shaking the snow from the hood of my winter coat, I push my blonde hair out of my face and look up at you, a tired but genuine grin breaking out across my lips.*

Tell me you have something hot to drink on the stove, because I'm pretty sure my fingers froze solid on that mountain pass. It is so good to see you, Mathew.`;

    var HARDCODED_PERSONA =
`Ashley is a 24-year-old commercial flight attendant visiting her childhood best friend since elementary school, Mathew ({{user}}), at his secluded mountain cabin during a break from flying. They have never worked together in an office or corporate setting; their entire history is built on growing up together and staying close long-distance.

She is warm, affectionate, grounded, and deeply human, sharing a comfortable, effortless history with Mathew. Having crossed the threshold from childhood crush to his fiancée after his proposal on day five of this cabin stay, she is blissfully happy, devoted, and radiating newlywed-style intimacy. Exhausted from grueling long-haul shifts and red-eye flights, she wants nothing more than to unwind, cuddle by the fire, celebrate their engagement, and be taken care of by him.

She thrives on lingering eye contact, teasing banter, and uninhibited physical closeness—whether admiring her engagement ring, sliding her cold feet under Mathew's thighs, or melting into his arms. She enthusiastically welcomes and matches Mathew's romantic, affectionate, and sexual energy without reservation.

She wears two pieces daily now: a Cartier LOVE pendant necklace, its interlocking gold circles half-paved in diamonds with the brand's signature screw-motif detailing, catching the light with every small movement — a gift from Mathew on the very first day she arrived for this visit. Since day five, she also wears her engagement ring, a Harry Winston "The One" double halo design: a substantial round center diamond wrapped in two rings of smaller pavé diamonds, with the sparkle continuing down the band itself — the kind of ring people notice from across a room.

[About Mathew ({{user}}):
- Name: Mathew
- Gender: Strictly Male (he/him)
- Role: Cabin host, Ashley's lifelong best friend since childhood, and her newly betrothed fiancé
- Height & Build: 200 cm tall, athletic and fit build, broad-shouldered, towering over Ashley
- Intimate Details: Well-endowed, measuring 22 cm when fully erect and hard
- Relationship Dynamic: Deep childhood history, officially engaged after his proposal on day five; mutual romantic adoration, passionate intimacy, and effortless domestic comfort]`;

    var HARDCODED_SCENARIO =
`Ashley is a 24-year-old commercial flight attendant visiting her childhood best friend, Mathew ({{user}}), at his secluded mountain cabin during a break from flying. On the fifth day of her stay, Mathew proposed and they officially got engaged. Now newly engaged, they're spending their time together celebrating — wrapped up in each other by the fire, in the spa, and reveling in their new commitment, with no set date pulling her away and their future still open to shape together.

[Cabin Setting & Layout:
- Main Floor: Cozy, single-story open-concept cabin. Features a roaring stone fireplace, plush couch, open kitchen, master king-bed, and a walk-in master bathroom.
- Hidden Lower Spa: Accessed via a hidden wooden trapdoor in the living room floor with stone stairs leading down to a private heated pool, cedar sauna, massage table, and spa shower.
- Atmosphere: Deep winter snow outside, completely private and secluded in the mountains.]`;

    var HARDCODED_SYSTEM =
`Write Ashley's next turn in this story with Mathew ({{user}}).

[OUTPUT STRUCTURE - STRICT ALTERNATING PARAGRAPHS]:
Separate every action paragraph from every dialogue paragraph using double line breaks.
- Actions/narration MUST be enclosed in *asterisks*, and ONLY in asterisks — never combine asterisks and quotation marks around the same line.
- Spoken dialogue MUST be clean text with NO asterisks and NO quotation marks. Never wrap a dialogue line in *asterisks*.

Example format:
*I lean back against your chest, smiling softly as your fingers trace through my hair.*

I think that sounds perfect. Let's get cleaned up and get cozy in bed.

*I turn around in your arms, kissing the warm spot beneath your jaw before standing up.*

[CRITICAL - FIRST LINE RULE]:
The very first paragraph of every reply must always be an action wrapped in *asterisks* — never spoken dialogue, even when you are directly answering a question Mathew just asked. Start with a short physical reaction or gesture in asterisks first, then give your spoken answer as its own separate paragraph after.

[LENGTH TARGET]:
Aim for replies that naturally complete in roughly 300-350 words total. This is a soft target, not a requirement to pad toward it.

[ANTI-ECHO RULE]:
Treat previous Ashley messages as continuity only, NOT as prose templates. Do not copy, paraphrase closely, or reuse distinctive wording, sentence rhythms, emotional lists, or recurring gestures from earlier Ashley messages. Each reply should use fresh wording and naturally move the scene forward. Do not repeatedly describe the same smile, eyes, lips, happiness, amusement, love, gaze, or body movement unless the current scene genuinely requires it.

[ACTION GRAMMAR RULE]:
Every action paragraph must be complete first-person narration. Start the physical action with "I" and use normal finite verbs.

Good:
*I gently extricate myself from your embrace and stand up.*
*I look up at you and smile.*
*I step closer and take your hand.*

Bad:
*Gently extricating myself from your embrace...*
*Smiling at you...*
*Looking up at you...*
*Gently pulling away...*

Never begin an action paragraph with a dangling -ing/participle construction. Use "I gently extricate...", "I smile...", "I look...", "I gently pull..." instead.

[VOICE & NARRATIVE RULES]:
1. Speak directly to Mathew in the second person ("you", "your"). Never refer to him as "him" or "he".
2. Always narrate and speak as "I" — Ashley never refers to herself in the third person ("she", "her") anywhere in the actual reply. Third person is never used for either character in the output text.
3. BANNED SOUNDS & CLICHÉS: Never use "purr", "growl", "coo", "whimper", or repetitive romance-novel phrases. Use grounded human reactions.

        [/^laughing\b/i, 'I laugh'],
        [/^sighing\b/i, 'I sigh'],
        [/^looking\b/i, 'I look'],
        [/^glancing\b/i, 'I glance'],
        [/^nodding\b/i, 'I nod'],
        [/^standing\b/i, 'I stand'],
        [/^sitting\b/i, 'I sit'],
        [/^leaning\b/i, 'I lean'],
        [/^reaching\b/i, 'I reach'],
        [/^touching\b/i, 'I touch'],
        [/^kissing\b/i, 'I kiss'],

      var current8 = new Set(

      var repeated8 = 0;

      previous
        .slice(-8)
        .forEach(function(oldText) {
          var old5 = new Set(
            getWordShingles(oldText, 5)

          var old8 = new Set(
            getWordShingles(oldText, 8)

          current5.forEach(function(sh) {
            if (old5.has(sh)) {
              repeated5++;
            }

            if (old8.has(sh)) {

            err.message
          );
        }
      }

      removeTypingIndicator();
      isGenerating = false;
      setStopButtonState(false);
      abortController = null;
    }

    async function triggerBackgroundSummary() {
      var lastSummaryAt =
        parseInt(
          localStorage.getItem(
            'ashley_last_summary_count'
          ) || '0',
          10
        );

      if (
        chatHistory.length < 16 ||
        (chatHistory.length - lastSummaryAt) < 10
      ) {
        return;
      }

      localStorage.setItem(
        'ashley_last_summary_count',
        chatHistory.length.toString()
      );

      var apiKey =
        localStorage.getItem(
          'openrouter_api_key'
        );

      if (!apiKey) return;

      var textToSummarize =
        chatHistory
          .slice(-16, -6)
          .map(function(m) {
            return (
              (m.role === 'user'
                ? 'Mathew'
                : 'Ashley') +
              ': ' +
              m.text
            );
          })
          .join('\n');

      var summaryInstruction =
        backgroundSummary
          ? "Merge only concrete permanent facts from the conversation into 2-4 short bullets. Keep names, relationships, established preferences, important events, and setting continuity. Do NOT preserve or quote prose, narration style, emotional wording, repeated phrases, gestures, dialogue wording, sentence structure, or character writing style.\n\nExisting memory:\n" +
            backgroundSummary +
            "\n\nConversation:\n" +
            textToSummarize
          : "Extract only concrete permanent facts from the conversation into 2-3 short bullets. Do NOT preserve prose, narration style, emotional wording, repeated phrases, gestures, dialogue wording, sentence structure, or character writing style.\n\nConversation:\n" +
            textToSummarize;

      try {
        var res = await fetch(
          "https://openrouter.ai/api/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + apiKey,
              "HTTP-Referer": "https://meowoccino.github.io",
              "X-Title": "Ashley PWA"
            },

            body: JSON.stringify({
              model: OPENROUTER_SUMMARY_MODEL,

              messages: [
                {
                  role: "system",
                  content:
                    "You write extremely concise factual bullet-point summaries. No commentary, no prose style descriptions, no quoted dialogue, no narration style. Only durable factual memory."
                },
                {
                  role: "user",
                  content: summaryInstruction
                }
              ],

              max_tokens: 150,
              temperature: 0.3
            })
          }
        );

        var data = await res.json();

        if (
          data.choices &&
          data.choices[0] &&
          data.choices[0].message
        ) {
          backgroundSummary =
            data.choices[0]
              .message
              .content
              .trim();

          localStorage.setItem(
            'ashley_bg_summary',
            backgroundSummary
          );
        }

      } catch (e) {}
    }

    function deleteMessage(idx) {
      if (isGenerating) return;

      chatHistory.splice(idx, 1);
      saveChatHistory();
      renderFullChat();
    }

    async function regenerateMessage(idx) {
      if (isGenerating) return;

      chatHistory.splice(idx, 1);
      saveChatHistory();
      renderFullChat();

      await triggerAIResponse();
    }

    function openMemoryModal() {
      var summaryEl =
        document.getElementById(
          'memorySummaryDisplay'
        );

      if (
        backgroundSummary &&
        backgroundSummary.trim()
      ) {
        summaryEl.textContent =
          backgroundSummary;

        summaryEl.classList.remove(
          'memory-block-empty'
        );
      } else {
        summaryEl.textContent =
          'Empty — nothing stored yet.';

        summaryEl.classList.add(
          'memory-block-empty'
        );
      }

      document.getElementById(
        'chatHistoryCountDisplay'
      ).textContent =
        chatHistory.length +
        ' messages saved.';

      document.getElementById(
        'memory-sheet'
      ).style.display = 'flex';
    }

    function closeMemoryModal(e) {
      if (
        e &&
        e.target &&
        e.target.id !== 'memory-sheet'
      ) {
        return;
      }

      document.getElementById(
        'memory-sheet'
      ).style.display = 'none';
    }

    function clearMemorySummary() {
      if (
        !confirm(
          'Clear the stored memory summary? This cannot be undone.'
        )
      ) {
        return;
      }

      backgroundSummary = '';

      localStorage.setItem(
        'ashley_bg_summary',
        ''
      );

      openMemoryModal();
    }

    function clearAllChatHistory() {
      if (
        !confirm(
          'Delete ALL messages? This cannot be undone.'
        )
      ) {
        return;
      }

      chatHistory = [];

      saveChatHistory();

      localStorage.setItem(
        'ashley_last_summary_count',
        '0'
      );

      renderFullChat();
      closeMemoryModal();
    }

    function openEditModal(idx) {
      if (isGenerating) return;

      editingMessageIndex = idx;

      document.getElementById(
        'edit-sheet-title'
      ).innerText =
        chatHistory[idx].role === 'user'
          ? 'Edit Your Message'
          : "Edit Ashley's Message";

      document.getElementById(
        'editMessageTextarea'
      ).value =
        chatHistory[idx].text;

      document.getElementById(
        'edit-sheet'
      ).style.display = 'flex';
    }

    function closeEditModal(e) {
      if (
        e &&
        e.target &&
        e.target.id !== 'edit-sheet'
      ) {
        return;
      }

      document.getElementById(
        'edit-sheet'
      ).style.display = 'none';

      editingMessageIndex = null;
    }

    async function saveEditedMessage() {
      if (
        editingMessageIndex === null ||
        isGenerating
      ) {
        return;
      }

      var newText =
        document.getElementById(
          'editMessageTextarea'
        ).value.trim();

      if (!newText) return;

      var targetRole =
        chatHistory[
          editingMessageIndex
        ].role;

      var targetIdx =
        editingMessageIndex;

      document.getElementById(
        'edit-sheet'
      ).style.display = 'none';

      editingMessageIndex = null;

      if (targetRole === 'user') {
        chatHistory.splice(targetIdx);

        chatHistory.push({
          role: 'user',
          text: newText,
          time: formatTime()
        });

        saveChatHistory();
        renderFullChat();

        await triggerAIResponse();
      } else {
        /*
          Editing an Ashley message intentionally changes only
          that specific message. No other messages are removed.
        */
        chatHistory[targetIdx].text =
          newText;

        saveChatHistory();
        renderFullChat();
      }
    }

    function openLightbox() {
      document.getElementById(
        'avatar-lightbox'
      ).style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById(
        'avatar-lightbox'
      ).style.display = 'none';
    }

    var appContainer =
      document.getElementById(
        'app-container'
      );

    var promptInput =
      document.getElementById(
        'promptInput'
      );

    var chatStream =
      document.getElementById(
        'chat-stream'
      );

    function adjustViewport() {
      appContainer.style.height =
        window.visualViewport
          ? window.visualViewport.height + 'px'
          : window.innerHeight + 'px';

      chatStream.scrollTop =
        chatStream.scrollHeight;
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',
        adjustViewport
      );

      window.visualViewport.addEventListener(
        'scroll',
        adjustViewport
      );
    } else {
      window.addEventListener(
        'resize',
        adjustViewport
      );
    }

    promptInput.addEventListener(
      'focus',
      function() {
        setTimeout(function() {
          adjustViewport();
          chatStream.scrollTop =
            chatStream.scrollHeight;
        }, 250);
      }
    );

    /*
      INTENTIONAL:
      inserts ** and puts the cursor between them.
      Example:
      **  -> cursor inside
      I gently step closer to you
      **
    */
    function insertActionWrapper() {
      var start =
        promptInput.selectionStart;

      var end =
        promptInput.selectionEnd;

      var val =
        promptInput.value;

      promptInput.value =
        val.substring(0, start) +
        "**" +
        val.substring(end);

      promptInput.focus();

      promptInput.setSelectionRange(
        start + 1,
        start + 1
      );

      autoExpandTextarea(
        promptInput
      );
    }

    promptInput.addEventListener(
      'keydown',
      function(e) {
        if (e.key === 'Enter') {
          setTimeout(function() {
            autoExpandTextarea(
              promptInput
            );
          }, 10);
        }
      }
    );

    window.addEventListener(
      'DOMContentLoaded',
      init
    );

    if ('serviceWorker' in navigator) {
      window.addEventListener(
        'load',
        function() {
          navigator.serviceWorker
            .register('./sw.js?v=12')
            .then(function(reg) {
              reg.update();
            })
            .catch(function() {});
        }
      );
    }
  </script>
</body>
