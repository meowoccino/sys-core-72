<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Ashley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090c;
      --char-bubble: rgba(18, 22, 32, 0.94);
      --char-border: rgba(212, 175, 122, 0.22);
      --user-bubble: rgba(34, 25, 18, 0.94);
      --user-border: rgba(224, 160, 96, 0.35);
      --gold-accent: #d4af7a;
      --action-color: #e2c4a2;
      --speech-text: #f5f2ed;
      --text-dim: #798091;
      --danger-color: #e06c75;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--speech-text); font-family: 'Plus Jakarta Sans', sans-serif; }

    #app-container { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
    #ambient-bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(circle at 50% 12%, #161a26 0%, #0a0b10 65%, #040507 100%); pointer-events: none; }
    #snow-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* Header */
    header {
      position: relative; z-index: 10; padding: 16px 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: transparent; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; will-change: transform, opacity; flex-shrink: 0;
    }
    header.header-hidden { transform: translateY(-90px); opacity: 0; pointer-events: none; }

    .top-bar-controls { width: 100%; display: flex; justify-content: flex-end; position: absolute; top: 14px; right: 18px; }
    .settings-btn { background: transparent; border: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #9ba2b3; cursor: pointer; }

    .avatar-wrapper {
      position: relative; width: 92px; height: 92px; border-radius: 50%; padding: 2.5px;
      background: linear-gradient(135deg, var(--gold-accent), rgba(212, 175, 122, 0.1) 80%);
      box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 20px rgba(212, 175, 122, 0.15); margin-bottom: 8px;
    }
    .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #151822; }

    .header-name {
      font-family: 'Italiana', serif; font-size: 1.6rem; letter-spacing: 3px; color: #ffffff;
      font-weight: 400; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Stream */
    #chat-stream {
      flex: 1; position: relative; z-index: 5; overflow-y: scroll; -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain; padding: 16px; display: flex; flex-direction: column; gap: 22px;
    }

    .msg-group.user { display: flex; justify-content: flex-end; width: 100%; }
    .msg-group.user .user-wrapper { max-width: 84%; display: flex; flex-direction: column; align-items: flex-end; }
    .msg-group.ashley { display: flex; justify-content: flex-start; width: 100%; }
    .msg-group.ashley .ashley-wrapper { max-width: 90%; display: flex; gap: 12px; align-items: flex-start; }

    .ashley-msg-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--gold-accent); flex-shrink: 0; margin-top: 4px; }
    .bubble-wrapper { display: flex; flex-direction: column; width: 100%; }

    .glass-bubble {
      padding: 16px 18px; border-radius: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); font-size: 0.95rem; line-height: 1.62;
    }
    .ashley .glass-bubble { background: var(--char-bubble); border: 1px solid var(--char-border); border-top-left-radius: 4px; }
    .user .glass-bubble { background: var(--user-bubble); border: 1px solid var(--user-border); border-top-right-radius: 4px; }

    .action { display: block; color: var(--action-color); font-style: italic; font-weight: 300; margin-bottom: 10px; }
    .speech { display: block; color: var(--speech-text); font-weight: 400; margin-bottom: 10px; }
    .action:last-child, .speech:last-child { margin-bottom: 0; }

    .meta-time-row {
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.72rem; margin-top: 6px; padding: 0 4px; color: var(--text-dim);
    }
    .meta-time-row svg { width: 12px; height: 12px; fill: currentColor; }

    /* Control buttons on Ashley messages */
    .msg-action-btn {
      background: transparent; border: none; color: var(--text-dim); cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; padding: 2px 4px; border-radius: 4px;
    }
    .msg-action-btn:active { color: var(--gold-accent); }
    .msg-action-btn.delete-btn:active { color: var(--danger-color); }
    .msg-action-btn svg { width: 13px; height: 13px; }

    /* Input Footer */
    footer { position: relative; z-index: 10; padding: 10px 16px 14px; background: transparent; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .dock-input {
      flex: 1; background: rgba(12, 14, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px; padding: 8px 14px; display: flex; align-items: center; gap: 8px;
    }
    .dock-input textarea {
      flex: 1; background: transparent; border: none; outline: none; color: #fff;
      font-family: inherit; font-size: 0.95rem; resize: none; max-height: 80px; line-height: 1.4;
    }
    .action-symbol-btn { background: transparent; border: none; color: var(--text-dim); font-size: 0.95rem; padding: 4px 6px; cursor: pointer; flex-shrink: 0; }
    .action-symbol-btn:active { color: var(--action-color); }

    /* Morphing Send / Stop Pill */
    .send-pill {
      width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #dfb479, #b88b48);
      border: none; color: #12100d; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
      transition: background 0.2s ease, border-radius 0.2s ease;
    }
    .send-pill.is-stopping {
      background: #3a2224; border: 1.5px solid var(--danger-color); color: var(--danger-color); border-radius: 14px;
    }

    /* Settings Sheet */
    .sheet-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 9999; align-items: flex-end;
    }
    .sheet-content {
      width: 100%; max-height: 88vh; background: #12141c; border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px 24px 0 0; padding: 22px 18px 34px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .sheet-section-title {
      font-size: 0.78rem; color: var(--gold-accent); text-transform: uppercase; letter-spacing: 1px;
      margin: 18px 0 10px; font-weight: 600; border-bottom: 1px solid rgba(212, 175, 122, 0.2); padding-bottom: 4px;
    }
    .sheet-section-title:first-child { margin-top: 0; }
    .field-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .input-box { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 12px; color: #fff; outline: none; font-size: 0.9rem; margin-bottom: 14px; font-family: inherit; }
    textarea.input-box { resize: vertical; min-height: 75px; line-height: 1.4; }
    .range-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .range-row input { flex: 1; accent-color: var(--gold-accent); }
    .save-btn { width: 100%; background: var(--gold-accent); border: none; padding: 14px; border-radius: 14px; color: #12100d; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 10px; }
    .icon { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <div id="ambient-bg"></div>
  <canvas id="snow-canvas"></canvas>

  <div id="app-container">
    <header id="main-header">
      <div class="top-bar-controls">
        <button type="button" class="settings-btn" onclick="openSettingsModal()" title="Settings">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.72 8.47a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6"/></svg>
        </button>
      </div>
      <div class="avatar-wrapper">
        <img src="./ashley.png" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80'" alt="Ashley">
      </div>
      <div class="header-name">Ashley</div>
    </header>

    <main id="chat-stream"></main>

    <footer id="input-footer">
      <div class="dock-input">
        <textarea id="promptInput" rows="1" placeholder="Type a message or action..."></textarea>
        <button type="button" class="action-symbol-btn" onclick="insertActionWrapper()">* *</button>
      </div>
      <button type="button" class="send-pill" id="actionBtn" onclick="handleActionClick()">
        <svg id="actionIcon" class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </footer>
  </div>

  <!-- Settings Sheet -->
  <div id="settings-sheet" class="sheet-overlay" onclick="closeSettingsModal(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-section-title">Backend Connection</div>
      <div class="field-label">AI Horde API Key</div>
      <input type="password" id="apiKeyInput" class="input-box" placeholder="0000000000 (or your key)">

      <div class="sheet-section-title">Formatting Directives</div>
      <div class="field-label">Speech & Narration Directives</div>
      <textarea id="formatDirectivesInput" class="input-box" rows="3"></textarea>

      <div class="sheet-section-title">Character Definition</div>
      <div class="field-label">Personality & Core Persona</div>
      <textarea id="personaInput" class="input-box" rows="3"></textarea>

      <div class="field-label">Current Scenario & Setting</div>
      <textarea id="scenarioInput" class="input-box" rows="3"></textarea>

      <div class="field-label">Example Messages (&lt;START&gt;)</div>
      <textarea id="examplesInput" class="input-box" rows="3"></textarea>

      <div class="field-label">First Message / Greeting</div>
      <textarea id="greetingInput" class="input-box" rows="3"></textarea>

      <div class="sheet-section-title">Generation Parameters</div>
      <div class="field-label"><span>Max New Tokens</span><span id="maxTokensVal">220</span></div>
      <div class="range-row"><input type="range" id="maxTokensRange" min="80" max="600" step="10" value="220" oninput="document.getElementById('maxTokensVal').innerText = this.value"></div>

      <div class="field-label"><span>Context Length</span><span id="contextVal">6144</span></div>
      <div class="range-row"><input type="range" id="contextRange" min="2048" max="8192" step="512" value="6144" oninput="document.getElementById('contextVal').innerText = this.value"></div>

      <div class="field-label"><span>Temperature</span><span id="tempVal">0.75</span></div>
      <div class="range-row"><input type="range" id="tempRange" min="0.3" max="1.5" step="0.05" value="0.75" oninput="document.getElementById('tempVal').innerText = this.value"></div>

      <button type="button" class="save-btn" onclick="saveSettings()">Save Configuration</button>
    </div>
  </div>

  <script>
    var DEFAULT_FORMATTING = "Write {{char}}'s responses using *action* for physical actions, gestures, and reactions. Spoken dialogue must be in plain text without quotation marks. Stay immersive, sensory, and grounded.";
    var DEFAULT_PERSONA = "Ashley: 24-year-old commercial flight attendant on vacation with her childhood best friend Mathew. Playful, teasing, romantic, affectionate. They crossed the line into lovers today.";
    var DEFAULT_SCENARIO = "Mathew and Ashley are alone at a secluded mountain cabin during a winter getaway. Snowstorm outside, fireplace burning warm inside.";
    var DEFAULT_GREETING = "*I drop onto the plush cushions by the fire, tucking my knees up to my chest with a teasing smirk.* Don't just stand there, delivery boy. Let's see what you picked out.";

    var chatHistory = [];
    var backgroundSummary = "";
    var isGenerating = false;
    var abortActive = false;

    function init() {
      try {
        var savedChat = localStorage.getItem('ashley_chat_history');
        if (savedChat) {
          chatHistory = JSON.parse(savedChat);
        } else {
          var greeting = localStorage.getItem('cfg_greeting') || DEFAULT_GREETING;
          chatHistory.push({ role: 'char', text: greeting, time: formatTime() });
          saveChatHistory();
        }
        backgroundSummary = localStorage.getItem('ashley_bg_summary') || "";
      } catch (e) {}
      renderFullChat();
    }

    function saveChatHistory() {
      try {
        localStorage.setItem('ashley_chat_history', JSON.stringify(chatHistory));
      } catch (e) {}
    }

    function parseMessage(text) {
      var parts = text.split(/(\*[^*]+\*)/g);
      return parts.map(function(part) {
        if (!part.trim()) return '';
        if (part.startsWith('*') && part.endsWith('*')) {
          return '<span class="action">' + part.slice(1, -1) + '</span>';
        }
        return '<span class="speech">' + part + '</span>';
      }).join('');
    }

    function formatTime() {
      var d = new Date();
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function renderFullChat() {
      var stream = document.getElementById('chat-stream');
      stream.innerHTML = '';
      chatHistory.forEach(function(msg, idx) {
        appendMessageDOM(msg.role, msg.text, msg.time, msg.duration, idx);
      });
      stream.scrollTop = stream.scrollHeight;
    }

    function appendMessageDOM(role, text, time, duration, idx) {
      var stream = document.getElementById('chat-stream');
      var metaStr = duration ? duration : time;
      var html = '';

      if (role === 'user') {
        html = '<div class="msg-group user" id="msg-' + idx + '"><div class="user-wrapper"><div class="glass-bubble">' +
          parseMessage(text) + '</div><div class="meta-time-row"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7z"/></svg><span>' +
          metaStr + '</span></div></div></div>';
      } else {
        html = '<div class="msg-group ashley" id="msg-' + idx + '"><div class="ashley-wrapper"><img class="ashley-msg-avatar" src="./ashley.png" onerror="this.src=\'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80\'"><div class="bubble-wrapper"><div class="glass-bubble">' +
          parseMessage(text) + '</div><div class="meta-time-row"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7z"/></svg><span>' +
          metaStr + '</span>' +
          '<button class="msg-action-btn" onclick="regenerateMessage(' + idx + ')" title="Reroll message"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>' +
          '<button class="msg-action-btn delete-btn" onclick="deleteMessage(' + idx + ')" title="Delete message"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>' +
          '</div></div></div></div>';
      }
      stream.insertAdjacentHTML('beforeend', html);
      stream.scrollTop = stream.scrollHeight;
    }

    function buildHordePrompt() {
      var formatting = localStorage.getItem('cfg_formatting') || DEFAULT_FORMATTING;
      var persona = localStorage.getItem('cfg_persona') || DEFAULT_PERSONA;
      var scenario = localStorage.getItem('cfg_scenario') || DEFAULT_SCENARIO;
      var examples = localStorage.getItem('cfg_examples') || '';

      var prompt = "[System: " + formatting + "]\n";
      prompt += "[Scenario: " + scenario + "]\n";
      prompt += "[Persona: " + persona + "]\n";
      if (backgroundSummary) {
        prompt += "[Persistent Context: " + backgroundSummary + "]\n";
      }
      if (examples) {
        prompt += examples + "\n";
      }

      var recent = chatHistory.slice(-10);
      recent.forEach(function(m) {
        prompt += (m.role === 'user' ? 'Mathew: ' : 'Ashley: ') + m.text + "\n";
      });
      prompt += "Ashley:";
      return prompt;
    }

    function handleActionClick() {
      if (isGenerating) {
        stopGeneration();
      } else {
        sendMessage();
      }
    }

    function setStopButtonState(stopping) {
      var btn = document.getElementById('actionBtn');
      var icon = document.getElementById('actionIcon');
      if (stopping) {
        btn.classList.add('is-stopping');
        icon.innerHTML = '<path d="M6 6h12v12H6z"/>';
      } else {
        btn.classList.remove('is-stopping');
        icon.innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
      }
    }

    function stopGeneration() {
      abortActive = true;
      isGenerating = false;
      setStopButtonState(false);
    }

    async function sendMessage() {
      if (isGenerating) return;
      var input = document.getElementById('promptInput');
      var userText = input.value.trim();
      if (!userText) return;

      input.value = '';
      var userTime = formatTime();
      chatHistory.push({ role: 'user', text: userText, time: userTime });
      saveChatHistory();
      renderFullChat();

      await triggerAIResponse();
    }

    async function triggerAIResponse() {
      isGenerating = true;
      abortActive = false;
      setStopButtonState(true);

      var apiKey = localStorage.getItem('horde_api_key') || '0000000000';
      var maxTokens = parseInt(localStorage.getItem('cfg_max_tokens') || '220', 10);
      var contextLen = parseInt(localStorage.getItem('cfg_context') || '6144', 10);
      var temp = parseFloat(localStorage.getItem('cfg_temp') || '0.75');

      var promptPayload = buildHordePrompt();
      var startTime = Date.now();

      try {
        var postRes = await fetch("https://aihorde.net/api/v2/generate/text/async", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": apiKey },
          body: JSON.stringify({
            prompt: promptPayload,
            params: {
              max_context_length: contextLen,
              max_length: maxTokens,
              temperature: temp,
              rep_pen: 1.15,
              stop_sequence: ["\nMathew:", "\n{{user}}:", "\nUser:"]
            },
            models: ["Behemoth 123B v1"]
          })
        });

        var postData = await postRes.json();
        var requestId = postData.id;

        var generatedText = "";
        while (true) {
          if (abortActive) return;
          await new Promise(function(r) { setTimeout(r, 2000); });
          if (abortActive) return;

          var checkRes = await fetch("https://aihorde.net/api/v2/generate/text/status/" + requestId);
          var checkData = await checkRes.json();

          if (checkData.done) {
            generatedText = checkData.generations[0].text.trim();
            break;
          }
          if (checkData.faulted) {
            throw new Error("Worker faulted");
          }
        }

        if (abortActive) return;

        var durationSec = Math.round((Date.now() - startTime) / 1000) + "s";
        chatHistory.push({ role: 'char', text: generatedText, time: formatTime(), duration: durationSec });
        saveChatHistory();
        renderFullChat();

        triggerBackgroundSummary(apiKey);
      } catch (err) {
        if (!abortActive) {
          var errText = "*Ashley looks distracted as the wind rattles the cabin doors.* (Connection error. Tap refresh or send to try again.)";
          chatHistory.push({ role: 'char', text: errText, time: formatTime(), duration: "Error" });
          saveChatHistory();
          renderFullChat();
        }
      } finally {
        isGenerating = false;
        setStopButtonState(false);
      }
    }

    function deleteMessage(idx) {
      if (isGenerating) return;
      chatHistory.splice(idx, 1);
      saveChatHistory();
      renderFullChat();
    }

    async function regenerateMessage(idx) {
      if (isGenerating) return;
      // Remove Ashley's response
      chatHistory.splice(idx, 1);
      saveChatHistory();
      renderFullChat();
      // Generate new one
      await triggerAIResponse();
    }

    async function triggerBackgroundSummary(apiKey) {
      if (chatHistory.length < 14 || chatHistory.length % 10 !== 0) return;
      var olderSlice = chatHistory.slice(-14, -6);
      var textToSummarize = olderSlice.map(function(m) { return (m.role === 'user' ? 'Mathew' : 'Ashley') + ': ' + m.text; }).join('\n');

      var prompt = "[System: Extract in 3 concise bullet points any permanent facts, purchased items, secrets, or changes in relationship:]\n" + textToSummarize + "\nKey facts:";

      try {
        var res = await fetch("https://aihorde.net/api/v2/generate/text/async", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": apiKey },
          body: JSON.stringify({
            prompt: prompt,
            params: { max_length: 80, temperature: 0.3 },
            models: ["APHODITE-Llama-3-8B"]
          })
        });
        var data = await res.json();
        var reqId = data.id;

        while (true) {
          await new Promise(function(r) { setTimeout(r, 2500); });
          var poll = await fetch("https://aihorde.net/api/v2/generate/text/status/" + reqId);
          var pollData = await poll.json();
          if (pollData.done) {
            backgroundSummary = (backgroundSummary + " " + pollData.generations[0].text).trim();
            localStorage.setItem('ashley_bg_summary', backgroundSummary);
            break;
          }
          if (pollData.faulted) break;
        }
      } catch (e) {}
    }

    function openSettingsModal() {
      try {
        document.getElementById('apiKeyInput').value = localStorage.getItem('horde_api_key') || '';
        document.getElementById('formatDirectivesInput').value = localStorage.getItem('cfg_formatting') || DEFAULT_FORMATTING;
        document.getElementById('personaInput').value = localStorage.getItem('cfg_persona') || DEFAULT_PERSONA;
        document.getElementById('scenarioInput').value = localStorage.getItem('cfg_scenario') || DEFAULT_SCENARIO;
        document.getElementById('examplesInput').value = localStorage.getItem('cfg_examples') || '';
        document.getElementById('greetingInput').value = localStorage.getItem('cfg_greeting') || DEFAULT_GREETING;
        var maxT = localStorage.getItem('cfg_max_tokens') || "220";
        var ctxL = localStorage.getItem('cfg_context') || "6144";
        var temp = localStorage.getItem('cfg_temp') || "0.75";

        document.getElementById('maxTokensRange').value = maxT;
        document.getElementById('maxTokensVal').innerText = maxT;
        document.getElementById('contextRange').value = ctxL;
        document.getElementById('contextVal').innerText = ctxL;
        document.getElementById('tempRange').value = temp;
        document.getElementById('tempVal').innerText = temp;
      } catch (e) {}
      document.getElementById('settings-sheet').style.display = 'flex';
    }

    function closeSettingsModal(e) {
      if (e && e.target && e.target.id !== 'settings-sheet') return;
      document.getElementById('settings-sheet').style.display = 'none';
    }

    function saveSettings() {
      try {
        localStorage.setItem('horde_api_key', document.getElementById('apiKeyInput').value.trim());
        localStorage.setItem('cfg_formatting', document.getElementById('formatDirectivesInput').value.trim());
        localStorage.setItem('cfg_persona', document.getElementById('personaInput').value.trim());
        localStorage.setItem('cfg_scenario', document.getElementById('scenarioInput').value.trim());
        localStorage.setItem('cfg_examples', document.getElementById('examplesInput').value.trim());
        localStorage.setItem('cfg_greeting', document.getElementById('greetingInput').value.trim());
        localStorage.setItem('cfg_max_tokens', document.getElementById('maxTokensRange').value);
        localStorage.setItem('cfg_context', document.getElementById('contextRange').value);
        localStorage.setItem('cfg_temp', document.getElementById('tempRange').value);
      } catch (e) {}
      document.getElementById('settings-sheet').style.display = 'none';
    }

    var chatStream = document.getElementById('chat-stream');
    var header = document.getElementById('main-header');
    var prevScroll = 0;
    var ticking = false;

    chatStream.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(function() {
          var st = chatStream.scrollTop;
          if (st > prevScroll && st > 40) {
            header.classList.add('header-hidden');
          } else if (st < prevScroll) {
            header.classList.remove('header-hidden');
          }
          prevScroll = st <= 0 ? 0 : st;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    var appContainer = document.getElementById('app-container');
    var promptInput = document.getElementById('promptInput');

    function adjustViewport() {
      if (window.visualViewport) {
        appContainer.style.height = window.visualViewport.height + 'px';
      } else {
        appContainer.style.height = window.innerHeight + 'px';
      }
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', adjustViewport);
      window.visualViewport.addEventListener('scroll', adjustViewport);
    } else {
      window.addEventListener('resize', adjustViewport);
    }

    promptInput.addEventListener('focus', function() {
      setTimeout(function() {
        adjustViewport();
        chatStream.scrollTop = chatStream.scrollHeight;
      }, 250);
    });

    var canvas = document.getElementById('snow-canvas');
    var ctx = canvas.getContext('2d');
    var width = canvas.width = window.innerWidth;
    var height = canvas.height = window.innerHeight;

    window.addEventListener('resize', function() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    var flakes = [];
    for (var i = 0; i < 40; i++) {
      flakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.6 + 0.6,
        speed: Math.random() * 0.6 + 0.3,
        opacity: Math.random() * 0.35 + 0.2
      });
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      for (var j = 0; j < flakes.length; j++) {
        var f = flakes[j];
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.globalAlpha = f.opacity;
        ctx.fill();
        f.y += f.speed;
        if (f.y > height) { f.y = -5; f.x = Math.random() * width; }
      }
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(drawSnow);
    }
    drawSnow();

    function insertActionWrapper() {
      var start = promptInput.selectionStart;
      var end = promptInput.selectionEnd;
      var val = promptInput.value;
      promptInput.value = val.substring(0, start) + "**" + val.substring(end);
      promptInput.focus();
      promptInput.setSelectionRange(start + 1, start + 1);
    }

    promptInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
